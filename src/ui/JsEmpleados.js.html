<script>
/**
 * Lógica de la vista "Gestión de empleados": dos listados con la misma forma,
 * elegidos con el selector #emp-tipos —
 *   - Internos: PERSONAL_KGP.
 *   - Terceros / independientes: PERSONAL_TERCEROS (mismas columnas).
 * Valores y etiquetas de cada tipo salen de la config
 * (KGP.ui.tiposResponsable(), CFG().TIPO_RESPONSABLE_* / ETIQUETA_*). Cada
 * api_* recibe el tipo como último argumento.
 *
 * Listado completo por tipo (api_listEmpleados), filtrado Y paginado en el
 * cliente (la tabla crece un empleado a la vez, no hace falta paginación
 * server-side — ver CLAUDE.md §2; el tamaño de página lo elige el usuario).
 * Alta/edición reutilizan KGP.entityModal (tipo "empleado"); la baja usa un
 * confirm en 2 pasos por fila (ninguna acción irreversible con un solo clic).
 *
 * Tras cualquier cambio se refresca KGP.catalog en segundo plano: el popup de
 * tarea de Gestionar OIS/OIP toma de ahí internos y terceros, y sin esto no
 * vería a la persona recién creada hasta recargar la página.
 */
window.KGP = window.KGP || {};

(function (KGP) {
  'use strict';

  var tipos = [];          // [{valor, etiqueta}] — KGP.ui.tiposResponsable()
  var state = {
    tipo: '',              // tipo visible (valor de tipos[i])
    listas: {},            // tipo -> [empleado]
    loaded: {},            // tipo -> true si ya se consultó en esta sesión
    q: '',
    page: 1,
    pageSize: 10,
    confirmDeleteId: null
  };

  var eventsWired = false;

  KGP.empleados.onEnter = function () {
    wireEvents();
    if (state.loaded[state.tipo]) return; // ya se cargó en esta sesión: no repetir la consulta al volver a la vista
    fetchList();
  };

  function esTercero() { return state.tipo === tipos[1].valor; }
  function nombreSingular() { return esTercero() ? 'tercero' : 'empleado'; }
  function lista() { return state.listas[state.tipo] || []; }

  function fetchList(opts) {
    opts = opts || {};
    var tipo = state.tipo;
    var tbody = document.getElementById('emp-tbody');
    if (!opts.silent) tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Cargando…</td></tr>';
    setRefreshSpinner(true);

    return KGP.apiCall('api_listEmpleados', [tipo]).then(function (list) {
      state.loaded[tipo] = true;
      state.listas[tipo] = list;
      state.confirmDeleteId = null;
      if (tipo === state.tipo) render();
    }).catch(function (err) {
      if (tipo !== state.tipo) return;
      tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No se pudo cargar el listado.</td></tr>';
      KGP.toast('No se pudo cargar el listado: ' + KGP.friendlyError(err), 'error');
    }).finally(function () {
      setRefreshSpinner(false);
    });
  }

  function setRefreshSpinner(show) {
    var el = document.getElementById('emp-refresh-spinner');
    if (el) el.style.display = show ? 'inline-block' : 'none';
  }

  function normalize(s) {
    return String(s || '').toLowerCase();
  }

  function filtered() {
    var q = normalize(state.q).trim();
    if (!q) return lista();
    return lista().filter(function (e) {
      return normalize(e.nombre).indexOf(q) !== -1 ||
        normalize(e.correo).indexOf(q) !== -1 ||
        normalize(e.cargo).indexOf(q) !== -1 ||
        normalize(e.telefono).indexOf(q) !== -1;
    });
  }

  var EDIT_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>';
  var TRASH_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';

  /** Página actual de filtered(), recortada a state.pageSize. Recorta state.page si la lista encogió (filtro/baja) y quedó fuera de rango. */
  function pageRows() {
    var rows = filtered();
    var totalPages = Math.max(1, Math.ceil(rows.length / state.pageSize));
    if (state.page > totalPages) state.page = totalPages;
    var start = (state.page - 1) * state.pageSize;
    return { rows: rows.slice(start, start + state.pageSize), total: rows.length };
  }

  function render() {
    var tbody = document.getElementById('emp-tbody');
    var page = pageRows();
    if (!page.total) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty-state">' +
        (lista().length ? 'No hay resultados que coincidan con la búsqueda.' : 'No hay ' + (esTercero() ? 'terceros' : 'empleados') + ' registrados todavía.') +
        '</td></tr>';
    } else {
      tbody.innerHTML = page.rows.map(rowHtml).join('');
    }
    renderPaginationInfo(page.total);
  }

  function renderPaginationInfo(total) {
    var el = document.getElementById('emp-page-info');
    var start = total ? (state.page - 1) * state.pageSize + 1 : 0;
    var end = Math.min(state.page * state.pageSize, total);
    el.textContent = total ? ('Mostrando ' + start + '–' + end + ' de ' + total) : 'Sin resultados';
    document.getElementById('emp-prev').disabled = state.page <= 1;
    document.getElementById('emp-next').disabled = end >= total;
  }

  function rowHtml(e) {
    var id = KGP.escapeHtml(e.idEmpleado);
    var actions = state.confirmDeleteId === e.idEmpleado
      ? '<div class="picker-row">' +
        '<span class="cell-muted">¿Eliminar?</span>' +
        '<button type="button" class="btn btn-sm btn-danger" data-action="confirm-yes" data-id="' + id + '">Sí</button>' +
        '<button type="button" class="btn btn-sm btn-ghost" data-action="confirm-no" data-id="' + id + '">Cancelar</button>' +
        '</div>'
      : '<div class="picker-row">' +
        '<button type="button" class="btn btn-sm btn-icon-edit" data-action="edit" data-id="' + id + '" title="Editar ' + nombreSingular() + '">' + EDIT_SVG + '</button>' +
        '<button type="button" class="btn btn-sm btn-icon-delete" data-action="delete" data-id="' + id + '" title="Eliminar ' + nombreSingular() + '">' + TRASH_SVG + '</button>' +
        '</div>';

    return '<tr>' +
      '<td class="cell-mono">' + id + '</td>' +
      '<td>' + KGP.escapeHtml(e.nombre || '—') + '</td>' +
      '<td class="cell-muted">' + KGP.escapeHtml(e.correo || '—') + '</td>' +
      '<td class="cell-muted">' + KGP.escapeHtml(e.telefono || '—') + '</td>' +
      '<td>' + KGP.escapeHtml(e.cargo || '—') + '</td>' +
      '<td>' + actions + '</td>' +
      '</tr>';
  }

  function findEmpleado(idEmpleado) {
    return lista().filter(function (e) { return e.idEmpleado === idEmpleado; })[0] || null;
  }

  /** Tras un alta/edición/baja: el popup de tarea (KGP.catalog) y Gestionar tareas deben ver el cambio. */
  function avisarCambio() {
    KGP.catalog.load(true).catch(function () { /* no crítico: se reintenta al recargar */ });
    if (KGP.tareas && KGP.tareas.markStale) KGP.tareas.markStale();
  }

  // ---------------- Selector Internos / Terceros ----------------

  function renderTipos() {
    document.getElementById('emp-tipos').innerHTML = tipos.map(function (t) {
      var on = t.valor === state.tipo;
      return '<button type="button" class="seg-option' + (on ? ' is-active' : '') + '" role="tab" aria-selected="' + on + '" data-tipo="' + KGP.escapeHtml(t.valor) + '">' + KGP.escapeHtml(t.etiqueta) + '</button>';
    }).join('');
    document.getElementById('emp-nuevo-btn').textContent = '+ Nuevo ' + nombreSingular();
  }

  function cambiarTipo(tipo) {
    if (tipo === state.tipo) return;
    state.tipo = tipo;
    state.page = 1;
    state.confirmDeleteId = null;
    renderTipos();
    if (state.loaded[tipo]) render();
    else fetchList();
  }

  // ---------------- Alta / edición (KGP.entityModal) ----------------

  function openCreateModal() {
    var tipo = state.tipo;
    var singular = nombreSingular();
    KGP.entityModal.open({
      type: 'empleado',
      mode: 'create',
      title: 'Agregar ' + singular,
      onSave: function (datos) {
        return KGP.apiCall('api_createEmpleado', [datos, tipo]).then(function (creado) {
          KGP.toast(singular.charAt(0).toUpperCase() + singular.slice(1) + ' "' + creado.nombre + '" guardado.', 'success');
          (state.listas[tipo] = state.listas[tipo] || []).push(creado);
          if (tipo === state.tipo) render();
          avisarCambio();
        }).catch(function (err) {
          KGP.toast('No se pudo guardar: ' + KGP.friendlyError(err), 'error');
          throw err;
        });
      }
    });
  }

  function openEditModal(idEmpleado) {
    var e = findEmpleado(idEmpleado);
    if (!e) return;
    var tipo = state.tipo;
    KGP.entityModal.open({
      type: 'empleado',
      mode: 'edit',
      title: 'Editar ' + nombreSingular(),
      editId: idEmpleado,
      initial: e,
      onSave: function (datos) {
        return KGP.apiCall('api_updateEmpleado', [idEmpleado, datos, tipo]).then(function (actualizado) {
          KGP.toast('Datos actualizados.', 'success');
          state.listas[tipo] = (state.listas[tipo] || []).map(function (x) {
            return x.idEmpleado === idEmpleado ? Object.assign({}, x, actualizado) : x;
          });
          if (tipo === state.tipo) render();
          avisarCambio();
        }).catch(function (err) {
          KGP.toast('No se pudo actualizar: ' + KGP.friendlyError(err), 'error');
          throw err;
        });
      }
    });
  }

  // ---------------- Baja (confirm en 2 pasos por fila) ----------------

  function askDelete(idEmpleado) {
    state.confirmDeleteId = idEmpleado;
    render();
  }

  function cancelDelete() {
    state.confirmDeleteId = null;
    render();
  }

  function confirmDelete(idEmpleado) {
    var tipo = state.tipo;
    KGP.apiCall('api_deleteEmpleado', [idEmpleado, tipo]).then(function () {
      KGP.toast('Registro eliminado.', 'success');
      state.listas[tipo] = (state.listas[tipo] || []).filter(function (e) { return e.idEmpleado !== idEmpleado; });
      state.confirmDeleteId = null;
      if (tipo === state.tipo) render();
      avisarCambio();
    }).catch(function (err) {
      KGP.toast('No se pudo eliminar: ' + KGP.friendlyError(err), 'error');
      state.confirmDeleteId = null;
      render();
    });
  }

  function debounce(fn, ms) {
    var t;
    return function () {
      var args = arguments;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(null, args); }, ms);
    };
  }

  // ---------------- Wiring ----------------

  function wireEvents() {
    if (eventsWired) return;
    eventsWired = true;

    tipos = KGP.ui.tiposResponsable();
    state.tipo = tipos[0].valor;
    renderTipos();

    document.getElementById('emp-tipos').addEventListener('click', function (e) {
      var b = e.target.closest('[data-tipo]');
      if (b) cambiarTipo(b.getAttribute('data-tipo'));
    });

    document.getElementById('emp-search').addEventListener('input', debounce(function (e) {
      state.q = e.target.value;
      state.page = 1;
      render();
    }, 250));

    document.getElementById('emp-page-size').addEventListener('change', function (e) {
      state.pageSize = Number(e.target.value);
      state.page = 1;
      render();
    });
    document.getElementById('emp-prev').addEventListener('click', function () {
      if (state.page <= 1) return;
      state.page--;
      render();
    });
    document.getElementById('emp-next').addEventListener('click', function () {
      if (state.page * state.pageSize >= filtered().length) return;
      state.page++;
      render();
    });

    document.getElementById('emp-refresh-btn').addEventListener('click', function () {
      fetchList({ silent: true });
    });

    document.getElementById('emp-nuevo-btn').addEventListener('click', openCreateModal);

    document.getElementById('emp-tbody').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-action]');
      if (!btn) return;
      var id = btn.getAttribute('data-id');
      var action = btn.getAttribute('data-action');
      if (action === 'edit') openEditModal(id);
      else if (action === 'delete') askDelete(id);
      else if (action === 'confirm-yes') confirmDelete(id);
      else if (action === 'confirm-no') cancelDelete();
    });
  }

}(window.KGP));
</script>
