<script>
/**
 * Lógica de la vista "Gestionar OIP". Calca "Gestionar OIS"
 * (JsOis.js.html): listado con KGP.localCache (stale-while-revalidate,
 * CLAUDE.md §2.2) y un detalle que siempre se trae fresco y bloquea la vista
 * hasta terminar de cargar (§3).
 *
 * Los datos compartidos (cliente/solicitante/establecimiento/encargado y
 * servicios) son los de la COTIZACIÓN padre: se editan con los mismos modales
 * compartidos (KGP.entityModal, KGP.servicioModal SIN tarifas) y al guardar se
 * reescriben en la cotización (api_updateOip devuelve cotizacionCambio). Lo
 * propio de la OIP es el plazo, las tareas (KGP.tareaModal) y la facturación.
 *
 * Dos diferencias de comportamiento frente a la OIS:
 *   1. Una OIP Finalizada NO queda de solo lectura (sigue facturando ~1 año),
 *      así que esta vista no tiene applyLockState.
 *   2. Las tareas se agrupan por el mes de su FECHA ENTREGA, con un apartado
 *      aparte para las de meses anteriores sin cerrar. La facturación se
 *      guarda al instante, no espera "Guardar cambios", y no toca documentos.
 */
window.KGP = window.KGP || {};

(function (KGP) {
  'use strict';

  var ESTADO_EN_CURSO = 'En curso';      // = CFG_().OIP_ESTADO_INICIAL / TAREA_ESTADO_INICIAL
  var ESTADO_FINALIZADA = 'Finalizada';  // = CFG_().OIP_ESTADO_FINALIZADA / TAREA_ESTADO_FINALIZADA
  var ESTADO_VENCIDA = 'Vencida';        // = CFG_().OIP_ESTADO_VENCIDA
  var MAX_TAREAS = KGP.cfg('MAX_TAREAS_OIP', 200);   // = CFG_().LIMITS.MAX_TAREAS_OIP (hoja CONFIG_GENERAL)
  var MAX_SERVICIOS = KGP.cfg('MAX_SERVICIOS', 10);  // = CFG_().LIMITS.MAX_SERVICIOS
  var IVA_TASA = KGP.cfg('IVA_TASA', 0.19);          // = CFG_().IVA_TASA (totales de la facturación, solo visuales)
  var FACT_PENDIENTE = 'PENDIENTE DE FACTURAR'; // = CFG_().FACT_ESTADO_PENDIENTE
  var FACT_FACTURADO = 'FACTURADO';             // = CFG_().FACT_ESTADO_FACTURADO

  var listState = {
    page: 1,
    pageSize: 20,
    total: 0,
    filters: { anio: '', estado: '', q: '' },
    sortBy: 'codigo',
    sortDir: 'asc',
    loaded: false,
    everLoaded: false
  };

  var detail = {
    idOip: null,
    oip: null,              // DTO de la OIP tal como vino del servidor (estado derivado incluido)
    idCotizacion: null,
    codigoCotizacion: '',
    clienteDetalle: null,   // {cliente, contactos:[], establecimientos:[]}
    servicios: [],          // [{localId, idServicio|null, tipo, codigoUnspsc, descripcion, actividades[]}]
    tareas: [],             // [{localId, idTarea|null, tarea, idEmpleado, responsable, fechaInicio, fechaEntrega, estado, observacion}]
    facturacion: [],        // [{idFacturacion, mes, year, cuota, numeroFactura, estado, fechaNotificacion}] — ya persistidas
    tiposServicio: [],
    unspscMap: {},
    empleados: [],
    entidadesEditadas: false
  };

  // Filtro de la sección Tareas (no viaja al servidor: se filtra en memoria
  // sobre detail.tareas). Arranca en el mes actual, como pidió el usuario.
  var tareaFilters = { anio: '', mes: '', estado: '' };

  var pendingOpenId = null;
  // Marcas de "dato viejo" que pone "Gestionar tareas" (KGP.oip.markStale)
  // cuando crea/edita/finaliza/elimina una tarea de una OIP.
  var listStale = false;
  var staleDetailId = null;
  var servicioSeq = 0;
  var tareaSeq = 0;
  var eventsWired = false;
  var yearsPopulated = false;
  var detailLoadToken = 0; // mismo propósito que en JsOis.js.html: descartar respuestas tardías
  var DETAIL_CALL_OPTS = { timeoutMs: 25000 };

  function $(id) { return document.getElementById(id); }

  /** 'yyyy-MM-dd' de hoy en hora local (no UTC: toISOString correría el día). */
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // ---------------- Entrada de la vista ----------------

  KGP.oip.onEnter = function () {
    wireEvents();
    if (!yearsPopulated) { populateYearsFilter(); yearsPopulated = true; }

    if (pendingOpenId) {
      var id = pendingOpenId;
      pendingOpenId = null;
      openDetail(id);
      return;
    }
    // La OIP abierta cambió desde "Gestionar tareas": se recarga fresca. Si
    // no, un "Guardar cambios" aquí reenviaría la lista de tareas vieja y
    // borraría (o revertiría) lo que se hizo allá.
    if (staleDetailId && staleDetailId === detail.idOip && !$('op-detail-wrap').hidden) {
      staleDetailId = null;
      KGP.toast('Las tareas de esta OIP cambiaron en "Gestionar tareas": se recargó con los datos actuales.', 'warning', 6000);
      openDetail(detail.idOip);
      return;
    }
    staleDetailId = null;
    if (listState.loaded) {
      if (listStale) { listStale = false; fetchList({ silent: true }); }
      return;
    }
    listStale = false;

    if (!listState.everLoaded) {
      listState.everLoaded = true;
      var cached = KGP.localCache.get('oip:list');
      if (cached && isDefaultListQuery()) {
        listState.total = cached.total;
        renderTable(cached.rows);
        renderPaginationInfo();
        fetchList({ silent: true });
        return;
      }
    }
    fetchList();
  };

  function isDefaultListQuery() {
    return !listState.filters.anio && !listState.filters.estado && !listState.filters.q && listState.page === 1 &&
      listState.sortBy === 'codigo' && listState.sortDir === 'asc' && listState.pageSize === 20;
  }

  /** Punto de entrada externo (botón "Ver OIP" de Gestionar cotización). */
  KGP.oip.openDetail = function (idOip) {
    if (KGP.state.view === 'oip') {
      openDetail(idOip);
    } else {
      pendingOpenId = idOip;
      KGP.nav('oip');
    }
  };

  /** Lo llama "Gestionar tareas" tras escribir una tarea de esta OIP: refrescar listado (y detalle si es esa misma) al volver. */
  KGP.oip.markStale = function (idOip) {
    listStale = true;
    if (idOip && detail.idOip === idOip) staleDetailId = idOip;
  };

  // ---------------- Listado ----------------

  function showList() {
    detailLoadToken++;
    setDetailBusy(false);
    $('op-detail-wrap').hidden = true;
    $('op-list-wrap').hidden = false;
    if (!listState.loaded) fetchList();
  }

  function fetchList(opts) {
    opts = opts || {};
    var tbody = $('op-tbody');
    if (!opts.silent) tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Cargando…</td></tr>';
    setListRefreshSpinner(true);

    var params = {
      anio: listState.filters.anio || null,
      estado: listState.filters.estado || null,
      q: listState.filters.q || '',
      page: listState.page,
      pageSize: listState.pageSize,
      sortBy: listState.sortBy,
      sortDir: listState.sortDir
    };

    return KGP.apiCall('api_listOip', [params]).then(function (res) {
      listState.loaded = true;
      listState.total = res.total;
      renderTable(res.rows);
      renderPaginationInfo();
      if (isDefaultListQuery()) KGP.localCache.set('oip:list', { total: res.total, rows: res.rows });
    }).catch(function (err) {
      if (!opts.silent) tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No se pudo cargar el listado.</td></tr>';
      KGP.toast('No se pudo cargar el listado de OIP: ' + KGP.friendlyError(err), 'error');
    }).finally(function () {
      setListRefreshSpinner(false);
    });
  }

  function setListRefreshSpinner(show) {
    var el = $('op-refresh-spinner');
    if (el) el.style.display = show ? 'inline-block' : 'none';
  }

  /** Insignia del estado de una OIP, de una tarea o de una fila de facturación. */
  function estadoBadgeClass(estado) {
    if (estado === ESTADO_FINALIZADA || estado === FACT_FACTURADO) return 'badge-aprobado';
    if (estado === ESTADO_VENCIDA) return 'badge-rechazado';
    return 'badge-revision';
  }

  function renderTable(rows) {
    var tbody = $('op-tbody');
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No hay OIP que coincidan con los filtros.</td></tr>';
      return;
    }
    tbody.innerHTML = rows.map(function (r) {
      return '<tr class="gestion-row" data-id="' + KGP.escapeHtml(r.idOip) + '">' +
        '<td class="cell-mono">' + KGP.escapeHtml(r.codigo) + '</td>' +
        '<td class="cell-mono">' + KGP.escapeHtml(r.codigoCotizacion || '—') + '</td>' +
        '<td>' + KGP.escapeHtml(r.clienteNombre || '—') + '</td>' +
        '<td class="cell-muted">' + KGP.escapeHtml(r.fechaElaboracion || '—') + '</td>' +
        '<td class="cell-muted">' + KGP.escapeHtml(r.fechaVencimiento || '—') + '</td>' +
        '<td>' + (r.numTareasFinalizadas || 0) + '/' + (r.numTareas || 0) + '</td>' +
        '<td><span class="badge ' + estadoBadgeClass(r.estado) + '">' + KGP.escapeHtml(r.estado) + '</span></td>' +
        '</tr>';
    }).join('');
  }

  function renderPaginationInfo() {
    var total = listState.total;
    var start = total ? (listState.page - 1) * listState.pageSize + 1 : 0;
    var end = Math.min(listState.page * listState.pageSize, total);
    $('op-page-info').textContent = total ? ('Mostrando ' + start + '–' + end + ' de ' + total) : 'Sin resultados';
    $('op-prev').disabled = listState.page <= 1;
    $('op-next').disabled = end >= total;
  }

  function populateYearsFilter() {
    var current = new Date().getFullYear();

    var sel = $('op-filter-anio');
    for (var y = current; y >= current - 4; y--) {
      var opt = document.createElement('option');
      opt.value = String(y);
      opt.textContent = String(y);
      sel.appendChild(opt);
    }

    // Filtro de tareas: años y meses. Arranca en el mes actual.
    var selAnio = $('op-tareas-anio');
    selAnio.innerHTML = '';
    for (var y2 = current + 1; y2 >= current - 4; y2--) {
      var o2 = document.createElement('option');
      o2.value = String(y2);
      o2.textContent = String(y2);
      selAnio.appendChild(o2);
    }
    var selMes = $('op-tareas-mes');
    for (var m = 1; m <= 12; m++) {
      var o3 = document.createElement('option');
      o3.value = String(m);
      o3.textContent = KGP.ui.mesNombre(m);
      selMes.appendChild(o3);
    }
    resetTareaFiltersToCurrentMonth();

    // Años del popup de factura (el año anterior puede ser el pasado).
    var selFy = $('fm-year');
    selFy.innerHTML = '';
    for (var y3 = current + 1; y3 >= current - 5; y3--) {
      var o4 = document.createElement('option');
      o4.value = String(y3);
      o4.textContent = String(y3);
      selFy.appendChild(o4);
    }
    var selFm = $('fm-mes');
    selFm.innerHTML = '';
    for (var m2 = 1; m2 <= 12; m2++) {
      var o5 = document.createElement('option');
      o5.value = String(m2);
      o5.textContent = KGP.ui.mesNombre(m2);
      selFm.appendChild(o5);
    }
  }

  function resetTareaFiltersToCurrentMonth() {
    var now = new Date();
    tareaFilters.anio = String(now.getFullYear());
    tareaFilters.mes = String(now.getMonth() + 1);
    $('op-tareas-anio').value = tareaFilters.anio;
    $('op-tareas-mes').value = tareaFilters.mes;
  }

  function debounce(fn, ms) {
    var t;
    return function () {
      var args = arguments;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(null, args); }, ms);
    };
  }

  function onFilterChange() {
    listState.page = 1;
    fetchList();
  }

  // ---------------- Detalle / edición ----------------

  function currentClienteId() { return $('op-cliente-select').value; }

  function openDetail(idOip) {
    var token = ++detailLoadToken;
    $('op-list-wrap').hidden = true;
    $('op-detail-wrap').hidden = false;
    detail.idOip = idOip;
    setDetailBusy(true);

    Promise.resolve().then(function () {
      resetDetailForm();
      return Promise.all([
        KGP.apiCall('api_getOip', [idOip], DETAIL_CALL_OPTS),
        KGP.catalog.load()
      ]);
    }).then(function (results) {
      if (token !== detailLoadToken) return;
      var d = results[0];
      var cat = results[1];

      detail.tiposServicio = cat.tiposServicio || [];
      detail.unspscMap = KGP.ui.buildUnspscMap(cat.catalogoPares || []);
      detail.empleados = KGP.ui.responsables(cat); // internos + terceros (popup de tarea)
      detail.oip = d.oip;
      detail.idCotizacion = d.oip.idCotizacion;
      detail.codigoCotizacion = d.oip.codigoCotizacion || d.cotizacion.codigo || '';

      fillGeneral(d.oip);

      detail.servicios = [];
      (d.servicios || []).forEach(addServicioToDetail);
      renderServiciosList();

      detail.tareas = [];
      (d.tareas || []).forEach(addTareaToDetail);
      resetTareaFiltersToCurrentMonth();
      renderTareasList(); // también pinta el resumen

      detail.facturacion = (d.facturacion || []).slice();
      renderFacturacion();

      return KGP.apiCall('api_getClienteDetalle', [d.cotizacion.idCliente], DETAIL_CALL_OPTS).then(function (det) {
        if (token !== detailLoadToken) return;
        detail.clienteDetalle = det;
        populateClienteSelects(det, d.cotizacion, d.establecimiento);
      });
    }).catch(function (err) {
      if (token !== detailLoadToken) return;
      KGP.toast('No se pudo cargar la OIP: ' + KGP.friendlyError(err), 'error', 7000);
      showList();
    }).finally(function () {
      if (token === detailLoadToken) setDetailBusy(false);
    });
  }

  function resetDetailForm() {
    $('op-servicios-list').innerHTML = '';
    $('op-tareas-list').innerHTML = '';
    $('op-doc-status').innerHTML = '';
    detail.oip = null;
    detail.idCotizacion = null;
    detail.codigoCotizacion = '';
    detail.servicios = [];
    detail.tareas = [];
    detail.facturacion = [];
    detail.clienteDetalle = null;
    detail.entidadesEditadas = false;
    facturaModal.close();
    setDocButton(null, null);
    clearInvalid();
    KGP.tareaModal.close();
  }

  function setDetailBusy(busy, text) {
    $('op-detail-loading').hidden = !busy;
    $('op-detail-content').hidden = busy;
    if (busy) $('op-detail-loading-text').textContent = text || 'Cargando OIP…';
  }

  function fillGeneral(o) {
    $('op-codigo').value = o.codigo || '—';
    $('op-cotizacion').value = detail.codigoCotizacion || '—';
    $('op-id-cotizacion').textContent = o.idCotizacion ? ('ID: ' + o.idCotizacion) : '';
    $('op-fecha').value = o.fechaElaboracion || '—';
    $('op-plazo').value = o.plazo === '' || o.plazo == null ? '' : o.plazo;
    $('op-fecha-venc').value = o.fechaVencimiento || '—';
    setDocButton(o.urlDocumento, o.docEstado);
  }

  function setDocButton(url, docEstado) {
    var btn = $('op-abrir-doc-btn');
    if (url && docEstado === 'OK') {
      btn.href = url;
      btn.hidden = false;
    } else {
      btn.hidden = true;
      btn.removeAttribute('href');
    }
  }

  /** Misma fórmula que el servidor: FECHA ELABORACION + PLAZO (días). */
  function recomputeVencimiento() {
    var fecha = detail.oip ? detail.oip.fechaElaboracion : '';
    var plazo = Number($('op-plazo').value);
    var out = $('op-fecha-venc');
    if (!fecha || !plazo || plazo < 1) { out.value = '—'; renderResumen(); return; }
    var d = new Date(fecha + 'T12:00:00');
    d.setDate(d.getDate() + Math.trunc(plazo));
    out.value = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    renderResumen();
  }

  function populateClienteSelects(det, cotizacion, establecimiento) {
    var clienteSel = $('op-cliente-select');
    KGP.ui.rebuildSelect(clienteSel, (KGP.catalog.current() || {}).clientes || [], function (c) { return c.idCliente; }, KGP.ui.clientLabel, '— Selecciona —');
    clienteSel.value = cotizacion.idCliente;

    var solSel = $('op-solicitante-select');
    KGP.ui.rebuildSelect(solSel, det.contactos, function (c) { return c.idContacto; }, KGP.ui.contactoLabel,
      det.contactos.length ? '— Selecciona —' : '— Sin contactos registrados —');
    solSel.value = cotizacion.idSolicitante;
    solSel.disabled = false;

    var estSel = $('op-establecimiento-select');
    KGP.ui.rebuildSelect(estSel, det.establecimientos, function (e) { return e.idEstablecimiento; }, KGP.ui.establecimientoLabel,
      det.establecimientos.length ? '— Selecciona —' : '— Sin establecimientos registrados —');
    estSel.value = cotizacion.idEstablecimiento;
    estSel.disabled = false;

    refreshEncargadoOptions();
    syncEditButtons();
  }

  function resetDependentsEmpty() {
    ['op-solicitante-select', 'op-establecimiento-select', 'op-encargado-select'].forEach(function (id) {
      var sel = $(id);
      sel.innerHTML = '<option value="">— Ninguno registrado aún —</option>';
      sel.disabled = false;
    });
    syncEditButtons();
  }

  function handleClienteChange() {
    var val = currentClienteId();
    if (!val) {
      detail.clienteDetalle = null;
      ['op-solicitante-select', 'op-establecimiento-select', 'op-encargado-select'].forEach(function (id) {
        var sel = $(id);
        sel.innerHTML = '<option value="">— Primero selecciona un cliente —</option>';
        sel.disabled = true;
      });
      syncEditButtons();
      return;
    }

    cargarClienteBasico(val);

    var solSel = $('op-solicitante-select');
    var estSel = $('op-establecimiento-select');
    var encSel = $('op-encargado-select');
    solSel.disabled = true; estSel.disabled = true; encSel.disabled = true;
    solSel.innerHTML = '<option value="">Cargando…</option>';
    estSel.innerHTML = '<option value="">Cargando…</option>';

    KGP.apiCall('api_getClienteDetalle', [val]).then(function (det) {
      detail.clienteDetalle = det;
      KGP.ui.rebuildSelect(solSel, det.contactos, function (c) { return c.idContacto; }, KGP.ui.contactoLabel,
        det.contactos.length ? '— Selecciona —' : '— Sin contactos registrados —');
      solSel.disabled = false;
      KGP.ui.rebuildSelect(estSel, det.establecimientos, function (e) { return e.idEstablecimiento; }, KGP.ui.establecimientoLabel,
        det.establecimientos.length ? '— Selecciona —' : '— Sin establecimientos registrados —');
      estSel.disabled = false;
      refreshEncargadoOptions();
      syncEditButtons();
    }).catch(function (err) {
      KGP.toast('No se pudo cargar el cliente: ' + KGP.friendlyError(err), 'error');
      ['op-solicitante-select', 'op-establecimiento-select'].forEach(function (id) {
        $(id).innerHTML = '<option value="">— Error al cargar, intenta de nuevo —</option>';
      });
    });
  }

  function cargarClienteBasico(idCliente) {
    return KGP.apiCall('api_getCliente', [idCliente]).then(function (cliente) {
      if (detail.clienteDetalle) {
        detail.clienteDetalle.cliente = cliente;
      } else {
        detail.clienteDetalle = { cliente: cliente, contactos: [], establecimientos: [] };
      }
    }).catch(function () { /* "Editar cliente" sigue deshabilitado hasta que llegue el detalle completo */ });
  }

  /** Mismo criterio que JsOis: el encargado se limita a los contactos asignados al establecimiento elegido. */
  function refreshEncargadoOptions() {
    var idEstablecimiento = $('op-establecimiento-select').value;
    var encSel = $('op-encargado-select');
    if (!idEstablecimiento || !detail.clienteDetalle) {
      encSel.innerHTML = '<option value="">— Selecciona un establecimiento primero —</option>';
      encSel.disabled = true;
      syncEditButtons();
      return;
    }
    var candidatos = detail.clienteDetalle.contactos.filter(function (c) { return c.idEstablecimiento === idEstablecimiento; });
    KGP.ui.rebuildSelect(encSel, candidatos, function (c) { return c.idContacto; }, KGP.ui.contactoLabel,
      candidatos.length ? '— Selecciona —' : '— Sin contactos asignados a este establecimiento —');
    encSel.disabled = false;
    if (candidatos.length === 1) encSel.value = candidatos[0].idContacto;
    syncEditButtons();
  }

  var EDIT_BTN_PAIRS = [
    ['op-cliente-select', 'op-cliente-editar-btn'],
    ['op-solicitante-select', 'op-solicitante-editar-btn'],
    ['op-establecimiento-select', 'op-establecimiento-editar-btn'],
    ['op-encargado-select', 'op-encargado-editar-btn']
  ];

  function syncEditButtons() {
    EDIT_BTN_PAIRS.forEach(function (pair) {
      var sel = $(pair[0]);
      var btn = $(pair[1]);
      if (sel && btn) btn.disabled = !sel.value;
    });
  }

  function findContacto(idContacto) {
    if (!detail.clienteDetalle) return null;
    return detail.clienteDetalle.contactos.filter(function (c) { return c.idContacto === idContacto; })[0] || null;
  }
  function findEstablecimiento(idEstablecimiento) {
    if (!detail.clienteDetalle) return null;
    return detail.clienteDetalle.establecimientos.filter(function (e) { return e.idEstablecimiento === idEstablecimiento; })[0] || null;
  }

  // ---------------- Modal genérico (KGP.entityModal) ----------------
  // Mismo patrón que JsOis.js.html, con los ids de esta vista. Cada alta/
  // edición exitosa marca detail.entidadesEditadas: esos datos también salen
  // en el documento de la cotización, que hay que regenerar al guardar.

  function crearClienteModal(datos) {
    return KGP.apiCall('api_createCliente', [datos]).then(function (creado) {
      KGP.toast('Cliente "' + creado.razonSocial + '" guardado.', 'success');
      detail.entidadesEditadas = true;
      KGP.catalog.load(true);
      KGP.ui.addOptionAndSelect($('op-cliente-select'), creado.idCliente, KGP.ui.clientLabel(creado));
      detail.clienteDetalle = { cliente: Object.assign({ idCliente: creado.idCliente, activo: 1 }, datos), contactos: [], establecimientos: [] };
      resetDependentsEmpty();
    }).catch(function (err) {
      if (err.code === 'CONFLICT' && err.details && err.details.idClienteExistente) {
        KGP.toast('Ya existe un cliente con ese número de identificación (' + err.details.razonSocial + ').', 'error', 7000);
      } else {
        KGP.toast('No se pudo guardar el cliente: ' + KGP.friendlyError(err), 'error');
      }
      throw err;
    });
  }

  function editarClienteModal(idCliente, datos) {
    return KGP.apiCall('api_updateCliente', [idCliente, datos]).then(function () {

  // ---------------- Servicios (KGP.servicioModal SIN tarifas) ----------------

  function stripActPrefix(texto) {
    return String(texto || '').replace(/^\d+\.\d+\s+/, '');
  }

  function openServicioModal(servicio) {
    KGP.servicioModal.open({
      tiposServicio: detail.tiposServicio,
      unspscMap: detail.unspscMap,
      showTarifas: false, // la OIP no muestra ni edita tarifas (el servidor conserva las de la cotización)
      initial: servicio || null,
      onSave: function (servicioData) {
        if (servicio) {
          Object.assign(servicio, servicioData);
        } else {
          detail.servicios.push(Object.assign({ localId: 'psrv' + (++servicioSeq), idServicio: null }, servicioData));
        }
        renderServiciosList();
      }
    });
  }

  function addServicioToDetail(s) {
    detail.servicios.push({
      localId: 'psrv' + (++servicioSeq),
      idServicio: s.idServicio,
      tipo: s.tipo || '',
      codigoUnspsc: s.codigoUnspsc || '',
      descripcion: s.descripcion || '',
      actividades: (s.actividades || []).map(stripActPrefix)
    });
  }

  function servicioSummary(s) {
    var n = (s.actividades || []).length;
    return (s.tipo || 'Sin tipo elegido') + ' — ' + n + ' actividad' + (n === 1 ? '' : 'es');
  }

  function renderServiciosList() {
    var list = $('op-servicios-list');
    list.innerHTML = '';
    detail.servicios.forEach(function (s, idx) {
      var frag = $('tpl-servicio').content.cloneNode(true);
      var row = frag.querySelector('[data-servicio]');
      row.dataset.localId = s.localId;
      row.querySelector('[data-numero]').textContent = String(idx + 1);
      row.querySelector('[data-servicio-summary]').textContent = servicioSummary(s);
      row.querySelector('[data-edit-servicio]').addEventListener('click', function () { openServicioModal(s); });
      row.querySelector('[data-remove-servicio]').addEventListener('click', function () {
        detail.servicios = detail.servicios.filter(function (x) { return x.localId !== s.localId; });
        renderServiciosList();
      });
      list.appendChild(frag);
    });
    $('op-servicios-count').textContent = '(' + detail.servicios.length + '/' + MAX_SERVICIOS + ')';
    $('op-add-servicio').disabled = detail.servicios.length >= MAX_SERVICIOS;
  }

  function collectServicios() {
    return detail.servicios.map(function (s) {
      return {
        idServicio: s.idServicio || '',
        tipo: s.tipo,
        codigoUnspsc: s.codigoUnspsc,
        descripcion: s.descripcion,
        actividades: (s.actividades || []).slice()
      };
    });
  }

  // ---------------- Tareas (agrupadas por mes de FECHA ENTREGA) ----------------

  function addTareaToDetail(t) {
    detail.tareas.push({
      localId: 'ptar' + (++tareaSeq),
      idTarea: t.idTarea || null,
      tarea: t.tarea || '',
      idEmpleado: t.idEmpleado || '',
      tipoResponsable: t.tipoResponsable || '', // INTERNO / TERCERO ('' = se deduce por el ID)
      responsable: t.responsable || '',
      fechaInicio: t.fechaInicio || '',
      fechaEntrega: t.fechaEntrega || '',
      estado: t.estado === ESTADO_FINALIZADA ? ESTADO_FINALIZADA : ESTADO_EN_CURSO,
      observacion: t.observacion || ''
    });
  }

  /** Clave comparable aaaamm de la FECHA ENTREGA de una tarea; null si no tiene fecha. */
  function periodoDeTarea(t) {
    if (!t.fechaEntrega || t.fechaEntrega.length < 7) return null;
    return Number(t.fechaEntrega.slice(0, 4)) * 100 + Number(t.fechaEntrega.slice(5, 7));
  }

  function periodoFiltrado() {
    var anio = Number(tareaFilters.anio);
    var mes = Number(tareaFilters.mes);
    if (!anio || !mes) return null;
    return anio * 100 + mes;
  }

  /**
   * Reparte detail.tareas en los dos bloques que pidió el usuario:
   *   - atrasadas: de meses ANTERIORES al filtrado y todavía sin finalizar
   *     (el "apartado de tareas vencidas o pendientes"). Solo aplica cuando
   *     hay un mes concreto seleccionado.
   *   - delMes: las del periodo filtrado (o todas las del año si el mes es
   *     "Todos"), ya pasadas por el filtro de estado.
   * Las tareas sin fecha de entrega caen siempre en delMes para que nunca
   * queden invisibles.
   */
  function splitTareas() {
    var periodo = periodoFiltrado();
    var anio = Number(tareaFilters.anio) || null;
    var filtroEstado = tareaFilters.estado;
    var atrasadas = [];
    var delMes = [];

    detail.tareas.forEach(function (t) {
      var p = periodoDeTarea(t);

      if (periodo && p && p < periodo && t.estado !== ESTADO_FINALIZADA) {
        atrasadas.push(t);
        return;
      }

      var entra;
      if (p === null) {
        entra = true;
      } else if (periodo) {
        entra = p === periodo;
      } else {
        entra = anio ? Math.floor(p / 100) === anio : true;
      }
      if (!entra) return;
      if (filtroEstado && t.estado !== filtroEstado) return;
      delMes.push(t);
    });

    // El apartado de atrasadas contradice el filtro "Completadas": ahí nunca
    // hay tareas finalizadas, así que se oculta en ese caso.
    if (filtroEstado === ESTADO_FINALIZADA) atrasadas = [];
    return { atrasadas: atrasadas, delMes: delMes };
  }

  /** Pinta una tarea (tpl-tarea, compartido con la OIS) dentro de `list`. */
  function renderTareaRow(list, t, numero) {
    var frag = $('tpl-tarea').content.cloneNode(true);
    var row = frag.querySelector('[data-tarea]');
    var finalizada = t.estado === ESTADO_FINALIZADA;
    row.classList.toggle('tarea-finalizada', finalizada);
    row.querySelector('[data-numero]').textContent = String(numero);
    row.querySelector('[data-tarea-title]').textContent = t.tarea;
    row.querySelector('[data-tarea-meta]').textContent =
      (t.responsable || '—') + ' · ' + (t.fechaInicio || '—') + ' → ' + (t.fechaEntrega || '—');
    var badge = row.querySelector('[data-tarea-estado]');
    badge.className = 'badge ' + estadoBadgeClass(t.estado);
    badge.textContent = t.estado;

    var btnFin = row.querySelector('[data-finalizar-tarea]');
    btnFin.title = finalizada ? 'Marcar como en curso' : 'Marcar como finalizada';
    btnFin.setAttribute('aria-label', btnFin.title);
    btnFin.classList.toggle('is-done', finalizada);

    btnFin.addEventListener('click', function () {
      t.estado = t.estado === ESTADO_FINALIZADA ? ESTADO_EN_CURSO : ESTADO_FINALIZADA;
      renderTareasList();
    });
    row.querySelector('[data-edit-tarea]').addEventListener('click', function () { openTareaModal(t); });
    row.querySelector('[data-remove-tarea]').addEventListener('click', function () {
      detail.tareas = detail.tareas.filter(function (x) { return x.localId !== t.localId; });
      renderTareasList();
    });
    list.appendChild(frag);
  }

  function renderTareasList() {
    var grupos = splitTareas();

    var vencList = $('op-tareas-vencidas-list');
    vencList.innerHTML = '';
    grupos.atrasadas.forEach(function (t, i) { renderTareaRow(vencList, t, i + 1); });
    $('op-tareas-vencidas-group').hidden = !grupos.atrasadas.length;
    $('op-tareas-vencidas-count').textContent = '(' + grupos.atrasadas.length + ')';

    var list = $('op-tareas-list');
    list.innerHTML = '';
    if (!grupos.delMes.length) {
      list.innerHTML = '<div class="empty-state tareas-empty">No hay tareas que coincidan con este filtro.</div>';
    }
    grupos.delMes.forEach(function (t, i) { renderTareaRow(list, t, i + 1); });

    var mes = Number(tareaFilters.mes);
    $('op-tareas-group-label').textContent = mes
      ? ('Tareas de ' + KGP.ui.mesNombre(mes) + ' de ' + tareaFilters.anio)
      : ('Tareas de ' + tareaFilters.anio);
    $('op-tareas-mes-count').textContent = '(' + grupos.delMes.length + ')';

    $('op-tareas-count').textContent = '(' + detail.tareas.length + '/' + MAX_TAREAS + ')';
    $('op-add-tarea').disabled = detail.tareas.length >= MAX_TAREAS;
    renderResumen();
  }

  function collectTareas() {
    return detail.tareas.map(function (t) {
      return {
        idTarea: t.idTarea || '',
        tarea: t.tarea,
        idEmpleado: t.idEmpleado,
        tipoResponsable: t.tipoResponsable || '',
        fechaInicio: t.fechaInicio,
        fechaEntrega: t.fechaEntrega,
        estado: t.estado,
        observacion: t.observacion || ''
      };
    });
  }

  /**
   * Popup compartido de tarea (KGP.tareaModal). Una tarea nueva se propone con
   * la fecha de hoy (requisito del usuario: "toma la fecha actual y queda como
   * tarea nueva del mes en el que estamos"), y tras guardarla el filtro salta
   * al mes de su fecha de entrega para que no quede fuera de la vista actual.
   */
  function openTareaModal(tarea) {
    var hoy = todayISO();
    KGP.tareaModal.open({
      empleados: detail.empleados,
      initial: tarea || null,
      fechaInicioDefault: hoy,
      fechaEntregaDefault: hoy,
      onSave: function (datos) {
        if (tarea) {
          Object.assign(tarea, datos);
        } else {
          addTareaToDetail(Object.assign({ estado: ESTADO_EN_CURSO }, datos));
        }
        if (datos.fechaEntrega && datos.fechaEntrega.length >= 7) {
          tareaFilters.anio = datos.fechaEntrega.slice(0, 4);
          tareaFilters.mes = String(Number(datos.fechaEntrega.slice(5, 7)));
          KGP.ui.addOption($('op-tareas-anio'), tareaFilters.anio, tareaFilters.anio);
          $('op-tareas-anio').value = tareaFilters.anio;
          $('op-tareas-mes').value = tareaFilters.mes;
        }
        renderTareasList();
      }
    });
  }

  // ---------------- Facturación (se guarda al instante) ----------------

  var facturaDeletePending = null; // idFacturacion con confirmación en línea abierta

  /**
   * Totales de la facturación (solo visuales, no se guardan): SUBTOTAL = suma
   * de las cuotas de todas las filas, facturadas o pendientes; IVA = SUBTOTAL ×
   * IVA_TASA; TOTAL = SUBTOTAL + IVA. Mismo redondeo que computeTotales de
   * JsGestion.js.html. Filas sin cuota registrada suman 0.
   */
  function computeFacturacionTotales() {
    var subtotal = 0;
    detail.facturacion.forEach(function (f) {
      if (f.cuota !== '' && f.cuota != null) subtotal += Number(f.cuota) || 0;
    });
    var iva = Math.round(subtotal * IVA_TASA * 100) / 100;
    return { subtotal: subtotal, iva: iva, total: Math.round((subtotal + iva) * 100) / 100 };
  }

  function renderFacturacionTotales() {
    var t = computeFacturacionTotales();
    // formatMoney muestra "—" para 0; aquí un total en cero es un dato, no un vacío.
    $('op-fact-subtotal').textContent = t.subtotal ? KGP.ui.formatMoney(t.subtotal) : '$0';
    $('op-fact-iva').textContent = t.iva ? KGP.ui.formatMoney(t.iva) : '$0';
    $('op-fact-total').textContent = t.total ? KGP.ui.formatMoney(t.total) : '$0';
  }

  function renderFacturacion() {
    var tbody = $('op-fact-tbody');
    $('op-fact-count').textContent = '(' + detail.facturacion.length + ')';
    renderFacturacionTotales();

    if (!detail.facturacion.length) {
      tbody.innerHTML = '<tr><td colspan="8" class="empty-state">Aún no hay facturación registrada en esta OIP.</td></tr>';
      renderResumen();
      return;
    }

    tbody.innerHTML = '';
    detail.facturacion.forEach(function (f, idx) {
      var tr = document.createElement('tr');
      var confirmando = facturaDeletePending === f.idFacturacion;

      tr.innerHTML =
        '<td class="cell-mono">' + (idx + 1) + '</td>' +
        '<td>' + KGP.escapeHtml(f.year || '—') + '</td>' +
        '<td>' + KGP.escapeHtml(KGP.ui.mesNombre(f.mes)) + '</td>' +
        '<td>' + KGP.escapeHtml(KGP.ui.formatMoney(f.cuota)) + '</td>' +
        '<td>' + KGP.escapeHtml(f.numeroFactura || '—') + '</td>' +
        '<td><span class="badge ' + estadoBadgeClass(f.estado) + '">' + KGP.escapeHtml(f.estado) + '</span></td>' +
        '<td class="cell-muted">' + KGP.escapeHtml(f.fechaNotificacion || '—') + '</td>';

      var tdAcc = document.createElement('td');
      tdAcc.className = 'fact-actions';

      if (confirmando) {
        var btnSi = document.createElement('button');
        btnSi.type = 'button';
        btnSi.className = 'btn btn-sm btn-danger';
        btnSi.textContent = 'Eliminar';
        btnSi.addEventListener('click', function () { eliminarFactura(f); });

        var btnNo = document.createElement('button');
        btnNo.type = 'button';
        btnNo.className = 'btn btn-sm';
        btnNo.textContent = 'Cancelar';
        btnNo.addEventListener('click', function () {
          facturaDeletePending = null;
          renderFacturacion();
        });

        tdAcc.appendChild(btnSi);
        tdAcc.appendChild(btnNo);
      } else {
        var btnEdit = document.createElement('button');
        btnEdit.type = 'button';
        btnEdit.className = 'btn btn-sm btn-icon-edit';
        btnEdit.title = 'Editar factura';
        btnEdit.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>';
        btnEdit.addEventListener('click', function () { facturaModal.open(f, idx + 1); });

        var btnDel = document.createElement('button');
        btnDel.type = 'button';
        btnDel.className = 'btn btn-sm btn-icon-delete';
        btnDel.title = 'Eliminar factura';
        btnDel.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';
        btnDel.addEventListener('click', function () {
          facturaDeletePending = f.idFacturacion;
          renderFacturacion();
        });

        tdAcc.appendChild(btnEdit);
        tdAcc.appendChild(btnDel);
      }

      tr.appendChild(tdAcc);
      tbody.appendChild(tr);
    });

    renderResumen();
  }

  function eliminarFactura(f) {
    facturaDeletePending = null;
    setDetailBusy(true, 'Eliminando la fila de facturación…');
    KGP.apiCall('api_deleteOipFactura', [detail.idOip, f.idFacturacion]).then(function (res) {
      detail.facturacion = res.facturacion || [];
      renderFacturacion();
      KGP.toast('Fila de facturación eliminada.', 'success');
    }).catch(function (err) {
      KGP.toast('No se pudo eliminar: ' + KGP.friendlyError(err), 'error');
      renderFacturacion();
    }).finally(function () {
      setDetailBusy(false);
    });
  }

  /**
   * Popup de factura. A diferencia del de tarea, "Guardar" SÍ escribe en la
   * base de datos (api_saveOipFactura) — por eso tiene su propio spinner y no
   * depende del "Guardar cambios" de la vista. No regenera documentos: la
   * facturación no se escribe en la plantilla.
   */
  var facturaModal = (function () {
    var state = { editando: null };

    function fieldEl(key) { return document.querySelector('#factura-modal-body .field[data-field="' + key + '"]'); }
    function markInvalid(key) { var f = fieldEl(key); if (f) f.classList.add('invalid'); }
    function clearInvalidModal() {
      document.querySelectorAll('#factura-modal-body .field.invalid').forEach(function (f) { f.classList.remove('invalid'); });
    }

    /** {mes, year} del mes anterior al actual: el valor por defecto que pidió el usuario. */
    function mesAnterior() {
      var d = new Date();
      d.setDate(1);
      d.setMonth(d.getMonth() - 1);
      return { mes: d.getMonth() + 1, year: d.getFullYear() };
    }

    function open(factura, ordinal) {
      state.editando = factura || null;
      clearInvalidModal();
      $('factura-modal-title').textContent = factura ? 'Editar factura' : 'Agregar factura';
      $('fm-numero').value = String(ordinal || (detail.facturacion.length + 1));

      var def = mesAnterior();
      var year = factura && factura.year ? factura.year : def.year;
      var mes = factura && factura.mes ? factura.mes : def.mes;
      // Si el año guardado quedó fuera del rango del desplegable, se agrega.
      KGP.ui.addOption($('fm-year'), String(year), String(year));
      $('fm-year').value = String(year);
      $('fm-mes').value = String(mes);

      $('fm-cuota').value = (factura && factura.cuota !== '' && factura.cuota != null) ? KGP.ui.formatMoney(factura.cuota) : '';
      $('fm-num-factura').value = (factura && factura.numeroFactura) || '';
      $('fm-estado').value = (factura && factura.estado) || FACT_PENDIENTE;

      $('factura-modal-overlay').classList.add('open');
      setTimeout(function () { $('fm-cuota').focus(); }, 50);
    }

    function close() {
      var el = $('factura-modal-overlay');
      if (el) el.classList.remove('open');
      state.editando = null;
      setSpinner(false);
    }

    function setSpinner(show) {
      var el = $('factura-modal-spinner');
      if (el) el.style.display = show ? 'inline-block' : 'none';
      $('factura-modal-save').disabled = show;
      $('factura-modal-cancel').disabled = show;
    }

    function save() {
      clearInvalidModal();
      var year = Number($('fm-year').value);
      var mes = Number($('fm-mes').value);
      var ok = true;
      if (!year) { markInvalid('year'); ok = false; }
      if (!mes) { markInvalid('mes'); ok = false; }
      if (!ok) { KGP.toast('Revisa los campos marcados en rojo.', 'error'); return; }

      var payload = {
        year: year,
        mes: mes,
        cuota: KGP.ui.parseDigits($('fm-cuota').value),
        numeroFactura: $('fm-num-factura').value.trim(),
        estado: $('fm-estado').value
      };
      var idFacturacion = state.editando ? state.editando.idFacturacion : '';

      setSpinner(true);
      KGP.apiCall('api_saveOipFactura', [detail.idOip, idFacturacion, payload]).then(function (res) {
        detail.facturacion = res.facturacion || [];
        close();
        renderFacturacion();
        KGP.toast(idFacturacion ? 'Factura actualizada.' : 'Factura agregada.', 'success');
      }).catch(function (err) {
        setSpinner(false);
        if (err.code === 'VALIDATION' && Array.isArray(err.details) && err.details.length) {
          KGP.toast(err.details.slice(0, 3).join(' · '), 'error', 7000);
        } else {
          KGP.toast('No se pudo guardar la factura: ' + KGP.friendlyError(err), 'error');
        }
      });
    }

    function wire() {
      $('factura-modal-close').addEventListener('click', close);
      $('factura-modal-cancel').addEventListener('click', close);
      $('factura-modal-save').addEventListener('click', save);
      KGP.ui.wireMoneyInput($('fm-cuota'), 10, null);
      $('factura-modal-overlay').addEventListener('click', function (e) {
        if (e.target.id === 'factura-modal-overlay') close();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && $('factura-modal-overlay').classList.contains('open')) close();
      });
    }

    return { open: open, close: close, wire: wire };
  }());

  // ---------------- Resumen ----------------

  function renderResumen() {
    var o = detail.oip || {};
    $('op-res-title').textContent = o.codigo || '—';
    $('op-res-cot').textContent = detail.codigoCotizacion || '—';
    $('op-res-fecha').textContent = o.fechaElaboracion || '—';
    $('op-res-venc').textContent = $('op-fecha-venc').value || '—';
    var finalizadas = detail.tareas.filter(function (t) { return t.estado === ESTADO_FINALIZADA; }).length;
    $('op-res-tareas').textContent = finalizadas + '/' + detail.tareas.length;
    $('op-res-elaborado').textContent = o.elaboradoPor || '—';
    $('op-res-actualizado').textContent = o.actualizadoPor || '—';

    // Facturado: suma de las cuotas ya FACTURADO, y cuántas filas de cuántas.
    var facturadas = detail.facturacion.filter(function (f) { return f.estado === FACT_FACTURADO; });
    var sumaFacturada = facturadas.reduce(function (acc, f) { return acc + (Number(f.cuota) || 0); }, 0);
    $('op-res-facturado').textContent = detail.facturacion.length
      ? (KGP.ui.formatMoney(sumaFacturada) + ' · ' + facturadas.length + '/' + detail.facturacion.length)
      : '—';

    var estado = o.estado || ESTADO_EN_CURSO;
    var badge = $('op-res-estado');
    badge.className = 'badge resumen-estado ' + estadoBadgeClass(estado);
    badge.textContent = estado;

    // Aviso informativo: todas las tareas marcadas en pantalla pero aún sin
    // guardar. A diferencia de la OIS, no advierte de bloqueo: la OIP no se
    // bloquea al finalizar.
    $('op-res-cierre').hidden = estado === ESTADO_FINALIZADA || !(detail.tareas.length && finalizadas === detail.tareas.length);
  }

  // ---------------- Validación visual ----------------

  function fieldEl(key) { return document.querySelector('#op-detail-wrap .field[data-field="' + key + '"]'); }
  function markInvalid(key) { var f = fieldEl(key); if (f) f.classList.add('invalid'); }
  function clearInvalid() { document.querySelectorAll('#op-detail-wrap .field.invalid').forEach(function (f) { f.classList.remove('invalid'); }); }

  function validateGeneral() {
    clearInvalid();
    var hasError = false;
    var plazo = Number($('op-plazo').value);
    if (!plazo || plazo < 1 || plazo > KGP.cfg('MAX_PLAZO_DIAS', 365)) { markInvalid('plazo'); hasError = true; }
    if (!currentClienteId()) { markInvalid('cliente'); hasError = true; }
    if (!$('op-solicitante-select').value) { markInvalid('solicitante'); hasError = true; }
    if (!$('op-establecimiento-select').value) { markInvalid('establecimiento'); hasError = true; }
    return !hasError;
  }

  // ---------------- Guardar cambios (BD -> documentos) ----------------

  function showDocStatus(text, kind, retryFn) {
    var el = $('op-doc-status');
    var html = '<div class="progress-note">';
    if (kind === 'busy') html += '<span class="spinner dark"></span>';
    html += '<span>' + KGP.escapeHtml(text) + '</span></div>';
    el.innerHTML = html;
    if (retryFn) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn btn-sm';
      btn.style.marginTop = '8px';
      btn.textContent = 'Reintentar';
      btn.addEventListener('click', retryFn);
      el.appendChild(btn);
    }
  }

  function handleGuardar() {
    if (!validateGeneral()) {
      KGP.toast('Revisa los campos marcados en rojo.', 'error');
      return;
    }
    var servicios = collectServicios();
    if (!servicios.length) {
      KGP.toast('La OIP debe tener al menos 1 servicio.', 'error');
      return;
    }

    var payload = {
      plazo: Number($('op-plazo').value),
      cliente: { idCliente: currentClienteId() },
      solicitante: { idContacto: $('op-solicitante-select').value },
      establecimiento: { idEstablecimiento: $('op-establecimiento-select').value },
      servicios: servicios,
      tareas: collectTareas(),
      entidadesEditadas: !!detail.entidadesEditadas
    };

    var idOip = detail.idOip;
    var idCotizacion = detail.idCotizacion;
    setDetailBusy(true, 'Guardando cambios en la base de datos…');

    KGP.apiCall('api_updateOip', [idOip, payload]).then(function (res) {
      KGP.toast('OIP ' + res.codigo + ' actualizada.', 'success');
      if (KGP.tareas.markStale) KGP.tareas.markStale(); // sus tareas también se ven en "Gestionar tareas"
      detail.entidadesEditadas = false;
      detail.oip.estado = res.estado;
      detail.oip.fechaVencimiento = res.fechaVencimiento;
      detail.oip.plazo = payload.plazo;
      detail.tareas = [];
      (res.tareas || []).forEach(addTareaToDetail);

      // Ids de servicios recién creados (para que un segundo guardado los
      // actualice en vez de duplicarlos) + "actualizado por".
      return KGP.apiCall('api_getOip', [idOip]).then(function (fresh) {
        detail.oip = fresh.oip;
        detail.servicios = [];
        (fresh.servicios || []).forEach(addServicioToDetail);
        detail.facturacion = fresh.facturacion || detail.facturacion;
      }).catch(function () { /* no crítico */ }).then(function () {
        recomputeVencimiento();
        renderServiciosList();
        renderTareasList();
        renderFacturacion();
        return regenerarDocs(idOip, idCotizacion, !!res.cotizacionCambio);
      });
    }).catch(function (err) {
      if (err.code === 'VALIDATION' && Array.isArray(err.details) && err.details.length) {
        KGP.toast(err.details.slice(0, 3).join(' · '), 'error', 8000);
      } else {
        KGP.toast('No se pudo guardar: ' + KGP.friendlyError(err), 'error', 6000);
      }
    }).finally(function () {
      setDetailBusy(false);
    });
  }

  /**
   * Fase 2: documentos. El de la cotización solo si cambió algo compartido
   * (nota 2 del usuario: no regenerarlo por cambios que solo afectan tareas);
   * el de la OIP siempre. Si uno falla, "Reintentar" repite solo lo que falta.
   */
  function regenerarDocs(idOip, idCotizacion, conCotizacion) {
    var pasoCot = conCotizacion
      ? function () {
        setDetailBusy(true, 'Actualizando el documento de la cotización…');
        return KGP.apiCall('api_regenerateDocument', [idCotizacion]);
      }
      : function () { return Promise.resolve(null); };

    return pasoCot().then(function () {
      setDetailBusy(true, 'Actualizando el documento de la OIP…');
      return KGP.apiCall('api_regenerateOipDocument', [idOip]).then(function (doc) {
        setDocButton(doc.docUrl, 'OK');
        showDocStatus(conCotizacion ? 'Documentos de la OIP y de la cotización actualizados.' : 'Documento de la OIP actualizado.', 'success');
      }).catch(function (err) {
        showDocStatus('Los cambios se guardaron, pero el documento de la OIP falló: ' + KGP.friendlyError(err), 'error', function () {
          regenerarDocs(idOip, idCotizacion, false).finally(function () { setDetailBusy(false); });
        });
      });
    }, function (err) {
      showDocStatus('Los cambios se guardaron, pero el documento de la cotización falló: ' + KGP.friendlyError(err), 'error', function () {
        regenerarDocs(idOip, idCotizacion, true).finally(function () { setDetailBusy(false); });
      });
    });
  }

  // ---------------- Wiring ----------------

  function wireEvents() {
    if (eventsWired) return;
    eventsWired = true;

    $('op-search').addEventListener('input', debounce(function (e) {
      listState.filters.q = e.target.value;
      onFilterChange();
    }, 350));
    $('op-filter-anio').addEventListener('change', function (e) { listState.filters.anio = e.target.value; onFilterChange(); });
    $('op-filter-estado').addEventListener('change', function (e) { listState.filters.estado = e.target.value; onFilterChange(); });
    $('op-sort-by').addEventListener('change', function (e) { listState.sortBy = e.target.value; onFilterChange(); });
    $('op-sort-dir').addEventListener('click', function () {
      listState.sortDir = listState.sortDir === 'asc' ? 'desc' : 'asc';
      $('op-sort-dir').textContent = listState.sortDir === 'asc' ? '↑ Ascendente' : '↓ Descendente';
      onFilterChange();
    });
    $('op-page-size').addEventListener('change', function (e) { listState.pageSize = Number(e.target.value); onFilterChange(); });
    $('op-refresh-btn').addEventListener('click', function () { fetchList({ silent: true }); });
    $('op-prev').addEventListener('click', function () {
      if (listState.page <= 1) return;
      listState.page--;
      fetchList();
    });
    $('op-next').addEventListener('click', function () {
      if (listState.page * listState.pageSize >= listState.total) return;
      listState.page++;
      fetchList();
    });
    $('op-tbody').addEventListener('click', function (e) {
      var row = e.target.closest('.gestion-row');
      if (row) openDetail(row.getAttribute('data-id'));
    });

    $('op-back-btn').addEventListener('click', function () {
      showList();
      fetchList({ silent: true });
    });
    $('op-ver-cot-btn').addEventListener('click', function () {
      if (detail.idCotizacion && KGP.gestion.openDetail) KGP.gestion.openDetail(detail.idCotizacion);
    });

    $('op-plazo').addEventListener('input', recomputeVencimiento);
    $('op-cliente-select').addEventListener('change', function () { handleClienteChange(); syncEditButtons(); });
    $('op-solicitante-select').addEventListener('change', syncEditButtons);
    $('op-establecimiento-select').addEventListener('change', refreshEncargadoOptions);
    $('op-encargado-select').addEventListener('change', syncEditButtons);

    $('op-cliente-nuevo-btn').addEventListener('click', function () {
      KGP.entityModal.open({ type: 'cliente', mode: 'create', onSave: crearClienteModal });
    });
    $('op-cliente-editar-btn').addEventListener('click', function () {
      if (!detail.clienteDetalle || !detail.clienteDetalle.cliente) return;
      var id = currentClienteId();
      KGP.entityModal.open({ type: 'cliente', mode: 'edit', editId: id, initial: detail.clienteDetalle.cliente, onSave: function (datos) { return editarClienteModal(id, datos); } });
    });
    $('op-solicitante-nuevo-btn').addEventListener('click', function () {
      KGP.entityModal.open({ type: 'contacto', mode: 'create', target: 'solicitante', onSave: function (datos) { return crearContactoModal('solicitante', datos); } });
    });
    $('op-solicitante-editar-btn').addEventListener('click', function () {
      var id = $('op-solicitante-select').value;
      var c = findContacto(id);
      if (!c) return;
      KGP.entityModal.open({ type: 'contacto', mode: 'edit', target: 'solicitante', editId: id, initial: c, onSave: function (datos) { return editarContactoModal(id, datos); } });
    });
    $('op-encargado-nuevo-btn').addEventListener('click', function () {
      KGP.entityModal.open({ type: 'contacto', mode: 'create', target: 'encargado', onSave: function (datos) { return crearContactoModal('encargado', datos); } });
    });
    $('op-encargado-editar-btn').addEventListener('click', function () {
      var id = $('op-encargado-select').value;
      var c = findContacto(id);
      if (!c) return;
      KGP.entityModal.open({ type: 'contacto', mode: 'edit', target: 'encargado', editId: id, initial: c, onSave: function (datos) { return editarContactoModal(id, datos); } });
    });
    $('op-establecimiento-nuevo-btn').addEventListener('click', function () {
      KGP.entityModal.open({ type: 'establecimiento', mode: 'create', onSave: crearEstablecimientoModal });
    });
    $('op-establecimiento-editar-btn').addEventListener('click', function () {
      var id = $('op-establecimiento-select').value;
      var est = findEstablecimiento(id);
      if (!est) return;
      KGP.entityModal.open({ type: 'establecimiento', mode: 'edit', editId: id, initial: est, onSave: function (datos) { return editarEstablecimientoModal(id, datos); } });
    });

    $('op-add-servicio').addEventListener('click', function () {
      if (detail.servicios.length >= MAX_SERVICIOS) { KGP.toast('Ya alcanzaste el máximo de ' + MAX_SERVICIOS + ' servicios.', 'warning'); return; }
      openServicioModal(null);
    });

    $('op-add-tarea').addEventListener('click', function () {
      if (detail.tareas.length >= MAX_TAREAS) { KGP.toast('Ya alcanzaste el máximo de ' + MAX_TAREAS + ' tareas.', 'warning'); return; }
      openTareaModal(null);
    });
    $('op-tareas-anio').addEventListener('change', function (e) { tareaFilters.anio = e.target.value; renderTareasList(); });
    $('op-tareas-mes').addEventListener('change', function (e) { tareaFilters.mes = e.target.value; renderTareasList(); });
    $('op-tareas-estado').addEventListener('change', function (e) { tareaFilters.estado = e.target.value; renderTareasList(); });
    $('op-tareas-mes-actual').addEventListener('click', function () {
      resetTareaFiltersToCurrentMonth();
      renderTareasList();
    });

    $('op-add-factura').addEventListener('click', function () { facturaModal.open(null, null); });
    $('op-guardar-btn').addEventListener('click', handleGuardar);

    facturaModal.wire();
  }

}(window.KGP));
</script>
