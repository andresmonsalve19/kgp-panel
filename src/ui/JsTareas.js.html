<script>
/**
 * Lógica de la vista "Gestionar tareas" (ui/ViewTareas.html).
 *
 * Datos: api_listTareas devuelve UN snapshot con todas las tareas de OIS y
 * OIP, las órdenes, los empleados, el usuario activo (`yo`) y la fecha del
 * servidor (`hoy`). Filtros, KPIs, orden y paginación se calculan aquí, en
 * memoria, así que ningún filtro cuesta un round-trip (mismo criterio que
 * "Gestión de empleados").
 *
 * Caché (CLAUDE.md §2.2): el primer ingreso de la sesión pinta de inmediato
 * el último snapshot de KGP.localCache y SIEMPRE pide el fresco en segundo
 * plano. Volver a la vista no repite la consulta salvo "Actualizar" o que
 * otra vista haya marcado el dato como viejo (KGP.tareas.markStale, lo llaman
 * "Gestionar OIS/OIP" al guardar).
 *
 * Escrituras: cada acción toca UNA tarea y se guarda al instante
 * (api_saveTarea / api_setTareaEstado / api_deleteTarea). El servidor
 * recalcula el estado de la orden y lo devuelve; aquí se actualiza la fila y
 * la orden sin releer todo. Después se regenera el documento de la orden en
 * segundo plano (cola por orden con debounce: varias acciones seguidas sobre
 * la misma orden generan UNA sola regeneración) y se marcan como viejas las
 * vistas de OIS/OIP para que muestren el cambio al volver a ellas.
 *
 * Reglas que vienen del servidor y se reflejan aquí: una OIS Finalizada es de
 * solo lectura (sus tareas no se pueden tocar); una OIP Finalizada sí se
 * puede seguir editando (CLAUDE.md §11.3).
 */
window.KGP = window.KGP || {};

(function (KGP) {
  'use strict';

  var ESTADO_EN_CURSO = 'En curso';     // = CFG_().TAREA_ESTADO_INICIAL
  var ESTADO_FINALIZADA = 'Finalizada'; // = CFG_().TAREA_ESTADO_FINALIZADA
  var DIAS_POR_VENCER = KGP.cfg('DIAS_POR_VENCER_TAREAS', 7); // = CFG_().DIAS_POR_VENCER_TAREAS (00_Config.js)
  var CACHE_KEY = 'tareas:snapshot';
  var PREFS_KEY = 'tareas:prefs';
  var YO = '__yo__';                    // valor del filtro de responsable "Mis tareas"
  var DOC_DEBOUNCE_MS = 1200;
  // Las escrituras solo se reintentan solas ante BUSY (el servidor no escribió
  // nada). Un TRANSPORT/TIMEOUT pudo haber guardado igual: reintentar a
  // ciegas un alta duplicaría la tarea.
  var WRITE_OPTS = { retryOn: ['BUSY'] };

  var data = { hoy: '', yo: '', tareas: [], ordenes: [], empleados: [], limites: { OIS: KGP.cfg('MAX_TAREAS', 20), OIP: KGP.cfg('MAX_TAREAS_OIP', 200) } };
  var ordenIdx = {};   // 'TIPO:idOrden' -> orden (mismo objeto que data.ordenes[i])

  var state = {
    filters: { q: '', responsable: '', estado: '', periodo: '', tipo: '', orden: '' },
    sort: 'prioridad',
    page: 1,
    pageSize: 20,
    loaded: false,      // ya llegó un snapshot fresco del servidor en esta sesión
    everLoaded: false,  // ya se entró a la vista en esta sesión
    stale: false,       // otra vista cambió tareas: refrescar al volver
    confirm: null       // {key, accion: 'delete' | 'finalizar'} — confirmación en línea de una fila
  };

  var pendingIds = {};  // tkey -> true mientras hay una escritura en curso sobre esa tarea
  var writeSeq = 0;     // sube con cada escritura terminada (para descartar snapshots que salieron antes)
  var refetchTrasEscrituras = false; // se descartó un snapshot por escrituras en curso: pedir otro al terminar
  var fetchToken = 0;
  var localSeq = 0;
  var eventsWired = false;

  function $(id) { return document.getElementById(id); }
  function h(s) { return KGP.escapeHtml(s); }
  function tkey(t) { return t.tipo + ':' + t.idTarea; }
  function okey(tipo, idOrden) { return tipo + ':' + idOrden; }
  function ordenDe(t) { return ordenIdx[okey(t.tipo, t.idOrden)] || null; }

  // ---------------- Fechas (ISO 'yyyy-MM-dd', sin zonas horarias) ----------------

  /** Hoy en hora local (solo mientras no haya llegado el `hoy` del servidor). */
  function todayISO() { return dateToISO(new Date()); }
  function isoToDate(iso) { return new Date(iso + 'T12:00:00'); }
  function dateToISO(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function addDaysISO(iso, n) { var d = isoToDate(iso); d.setDate(d.getDate() + n); return dateToISO(d); }
  function diffDays(a, b) { return Math.round((isoToDate(a) - isoToDate(b)) / 86400000); }
  function monthRange(iso, delta) {
    var d = isoToDate(iso);
    var first = new Date(d.getFullYear(), d.getMonth() + delta, 1, 12);
    var last = new Date(d.getFullYear(), d.getMonth() + delta + 1, 0, 12);
    return [dateToISO(first), dateToISO(last)];
  }

  /** [desde, hasta] (inclusive) del filtro de fecha de entrega, o null. */
  function periodoRange(p) {
    var hoy = data.hoy;
    switch (p) {
      case 'hoy': return [hoy, hoy];
      case 'semana': {
        var dow = (isoToDate(hoy).getDay() + 6) % 7; // 0 = lunes
        var lunes = addDaysISO(hoy, -dow);
        return [lunes, addDaysISO(lunes, 6)];
      }
      case 'mes': return monthRange(hoy, 0);
      case 'mesSiguiente': return monthRange(hoy, 1);
      case 'mesAnterior': return monthRange(hoy, -1);
      default: return null;
    }
  }

  // ---------------- Situación derivada de una tarea ----------------

  /**
   * 'finalizada' | 'vencida' (entrega < hoy) | 'porVencer' (entrega en los
   * próximos DIAS_POR_VENCER días, hoy incluido) | 'alDia'. Mismo criterio de "vencida" que
   * el estado de las órdenes: el propio día de entrega aún no está vencido.
   */
  function situacion(t) {
    if (t.estado === ESTADO_FINALIZADA) return 'finalizada';
    if (!t.fechaEntrega) return 'alDia';
    var d = diffDays(t.fechaEntrega, data.hoy);
    if (d < 0) return 'vencida';
    if (d <= DIAS_POR_VENCER) return 'porVencer';
    return 'alDia';
  }

  function cumpleEstado(t, estado) {
    if (!estado) return true;
    var s = situacion(t);
    if (estado === 'pendientes') return s !== 'finalizada';
    if (estado === 'vencidas') return s === 'vencida';
    if (estado === 'porVencer') return s === 'porVencer';
    if (estado === 'alDia') return s === 'alDia';
    if (estado === 'finalizadas') return s === 'finalizada';
    return true;
  }

  function tareaEditable(t) {
    var o = ordenDe(t);
    return !!o && !o.cerrada;
  }

  // ---------------- Filtros ----------------

  function norm(s) {
    return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  }

  function responsableFiltro() {
    var r = state.filters.responsable;
    return r === YO ? data.yo : r;
  }

  /** Todos los filtros MENOS el de estado: es el universo sobre el que se calculan los KPIs. */
  function cumpleBase(t) {
    var f = state.filters;
    if (f.tipo && t.tipo !== f.tipo) return false;
    if (f.orden && okey(t.tipo, t.idOrden) !== f.orden) return false;
    var resp = responsableFiltro();
    if (f.responsable && String(t.idEmpleado) !== String(resp)) return false;
    if (f.periodo) {
      var rango = periodoRange(f.periodo);
      if (rango && (!t.fechaEntrega || t.fechaEntrega < rango[0] || t.fechaEntrega > rango[1])) return false;
    }
    if (f.q) {
      var o = ordenDe(t) || {};
      var hay = norm([t.tarea, t.responsable, o.codigo, o.codigoCotizacion, o.clienteNombre, t.observacion].join(' '));
      if (hay.indexOf(norm(f.q).trim()) === -1) return false;
    }
    return true;
  }

  var RANK = { vencida: 0, porVencer: 1, alDia: 2, finalizada: 3 };

  function cmpStr(a, b) { return String(a || '').localeCompare(String(b || ''), 'es'); }
  /** Fechas vacías siempre al final, sin importar el sentido. */
  function cmpFecha(a, b, dir) {
    if (!a && !b) return 0;
    if (!a) return 1;
    if (!b) return -1;
    return dir * (a < b ? -1 : a > b ? 1 : 0);
  }

  function sortRows(rows) {
    var sort = state.sort;
    return rows.slice().sort(function (a, b) {
      var r;
      switch (sort) {
        case 'entregaAsc': r = cmpFecha(a.fechaEntrega, b.fechaEntrega, 1); break;
        case 'entregaDesc': r = cmpFecha(a.fechaEntrega, b.fechaEntrega, -1); break;
        case 'recientes': r = cmpFecha(a.fechaInicio, b.fechaInicio, -1) || (b.fila - a.fila); break;
        case 'orden': r = cmpStr((ordenDe(a) || {}).codigo, (ordenDe(b) || {}).codigo) || cmpFecha(a.fechaEntrega, b.fechaEntrega, 1); break;
        case 'responsable': r = cmpStr(a.responsable, b.responsable) || cmpFecha(a.fechaEntrega, b.fechaEntrega, 1); break;
        default: {
          // Prioridad: vencidas (la más atrasada primero) -> por vencer -> al
          // día (por entrega más próxima) -> finalizadas (la más reciente primero).
          var sa = situacion(a), sb = situacion(b);
          r = RANK[sa] - RANK[sb] || cmpFecha(a.fechaEntrega, b.fechaEntrega, sa === 'finalizada' ? -1 : 1);
        }
      }
      return r || cmpStr((ordenDe(a) || {}).codigo, (ordenDe(b) || {}).codigo) || (a.fila - b.fila);
    });
  }

  function computeView() {
    var base = data.tareas.filter(cumpleBase);
    var counts = { total: base.length, pendientes: 0, vencida: 0, porVencer: 0, alDia: 0, finalizada: 0 };
    base.forEach(function (t) {
      var s = situacion(t);
      counts[s]++;
      if (s !== 'finalizada') counts.pendientes++;
    });
    var rows = sortRows(base.filter(function (t) { return cumpleEstado(t, state.filters.estado); }));
    return { counts: counts, rows: rows };
  }

  // ---------------- Render ----------------

  var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>';
  var EDIT_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>';
  var TRASH_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';
  var VIEW_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
  var HISTORY_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>';
  var LOCK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';

  function render() {
    var view = computeView();
    var totalPages = Math.max(1, Math.ceil(view.rows.length / state.pageSize));
    if (state.page > totalPages) state.page = totalPages;
    renderKpis(view.counts);
    renderChips();
    renderTable(view.rows);
    renderPagination(view.rows.length);
  }

  function pct(n, total) { return total ? Math.round((n / total) * 100) : 0; }

  function renderKpis(c) {
    var activo = state.filters.estado;
    var kpis = [
      { id: '', label: 'Todas las tareas', value: c.total, sub: 'con los filtros actuales', tone: '', meter: c.total ? 100 : 0 },
      { id: 'pendientes', label: 'Pendientes', value: c.pendientes, sub: pct(c.pendientes, c.total) + '% sin finalizar', tone: '', meter: pct(c.pendientes, c.total) },
      { id: 'vencidas', label: 'Vencidas', value: c.vencida, sub: 'la entrega ya pasó', tone: 'alert', meter: pct(c.vencida, c.total) },
      { id: 'porVencer', label: 'Vencen en ' + DIAS_POR_VENCER + ' días', value: c.porVencer, sub: 'incluye las de hoy', tone: 'warn', meter: pct(c.porVencer, c.total) },
      { id: 'finalizadas', label: 'Finalizadas', value: c.finalizada, sub: pct(c.finalizada, c.total) + '% completado', tone: 'good', meter: pct(c.finalizada, c.total) }
    ];
    $('tg-kpis').innerHTML = kpis.map(function (k) {
      var on = activo === k.id;
      var clases = ['kpi-card', 'kpi-action'];
      if (k.tone) clases.push(k.tone);
      if (on) clases.push('kpi-active');
      return '<button type="button" class="' + clases.join(' ') + '" data-kpi="' + h(k.id) + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
        '<span class="label">' + h(k.label) + '</span>' +
        '<span class="value">' + h(k.value) + '</span>' +
        '<span class="sub">' + h(k.sub) + '</span>' +
        '<span class="kpi-meter"><span style="width:' + k.meter + '%"></span></span>' +
        '</button>';
    }).join('');
  }

  function selectedText(id) {
    var sel = $(id);
    var opt = sel.options[sel.selectedIndex];
    return opt ? opt.textContent : '';
  }

  var CHIP_LABELS = {
    q: 'Búsqueda', responsable: 'Responsable', estado: 'Estado', periodo: 'Entrega', tipo: 'Tipo', orden: 'Orden'
  };
  var CHIP_SELECTS = {
    responsable: 'tg-filter-responsable', estado: 'tg-filter-estado', periodo: 'tg-filter-periodo',
    tipo: 'tg-filter-tipo', orden: 'tg-filter-orden'
  };

  function renderChips() {
    var f = state.filters;
    var chips = Object.keys(CHIP_LABELS).filter(function (k) { return f[k]; }).map(function (k) {
      var texto = k === 'q' ? '"' + f.q + '"' : selectedText(CHIP_SELECTS[k]);
      return '<button type="button" class="chip" data-chip="' + k + '" title="Quitar este filtro">' +
        h(CHIP_LABELS[k]) + ': ' + h(texto) + ' <span class="chip-x" aria-hidden="true">✕</span></button>';
    });
    var box = $('tg-chips');
    box.hidden = !chips.length;
    box.innerHTML = chips.length
      ? '<span class="chips-label">Filtros activos</span>' + chips.join('') +
        (chips.length > 1 ? '<button type="button" class="chip" data-chip="__all__">Limpiar todo <span class="chip-x" aria-hidden="true">✕</span></button>' : '')
      : '';
  }

  function hayFiltros() {
    var f = state.filters;
    return !!(f.q || f.responsable || f.estado || f.periodo || f.tipo || f.orden);
  }

  function renderTable(rows) {
    var tbody = $('tg-tbody');
    if (!rows.length) {
      var msg;
      if (!data.tareas.length) {
        msg = 'Aún no hay tareas registradas. Crea la primera con "+ Nueva tarea".';
      } else if (hayFiltros()) {
        msg = 'No hay tareas que coincidan con los filtros. <button type="button" class="btn btn-sm" data-action="clear-filters">Limpiar filtros</button>';
      } else {
        msg = 'No hay tareas para mostrar.';
      }
      tbody.innerHTML = '<tr><td colspan="7" class="empty-state">' + msg + '</td></tr>';
      return;
    }
    var start = (state.page - 1) * state.pageSize;
    tbody.innerHTML = rows.slice(start, start + state.pageSize).map(rowHtml).join('');
  }

  function entregaHtml(t) {
    if (!t.fechaEntrega) return '<span class="cell-muted">—</span>';
    var html = '<div class="cell-mono">' + h(t.fechaEntrega) + '</div>';
    if (t.estado === ESTADO_FINALIZADA) return html;
    var d = diffDays(t.fechaEntrega, data.hoy);
    var txt, cls;
    if (d < 0) { txt = 'Vencida hace ' + (-d) + ' día' + (d === -1 ? '' : 's'); cls = 'overdue'; }
    else if (d === 0) { txt = 'Vence hoy'; cls = 'soon'; }
    else if (d === 1) { txt = 'Vence mañana'; cls = 'soon'; }
    else if (d <= DIAS_POR_VENCER) { txt = 'Vence en ' + d + ' días'; cls = 'soon'; }
    else { txt = 'Faltan ' + d + ' días'; cls = ''; }
    return html + '<div class="days-left tg-days ' + cls + '">' + txt + '</div>';
  }

  function estadoBadge(t) {
    var s = situacion(t);
    if (s === 'finalizada') return '<span class="badge badge-aprobado">Finalizada</span>';
    if (s === 'vencida') return '<span class="badge badge-rechazado">Vencida</span>';
    return '<span class="badge badge-revision">En curso</span>';
  }

  function rowHtml(t) {
    var key = tkey(t);
    var k = h(key);
    var o = ordenDe(t) || {};
    var editable = tareaEditable(t);
    var busy = !!pendingIds[key];
    var fin = t.estado === ESTADO_FINALIZADA;
    var obs = String(t.observacion || '').split('\n').filter(function (l) { return l.trim(); });

    var check = editable
      ? '<button type="button" class="btn btn-sm btn-icon-done' + (fin ? ' is-done' : '') + '" data-action="toggle" data-key="' + k + '"' +
        ' title="' + (fin ? 'Reabrir (volver a En curso)' : 'Marcar como finalizada') + '" aria-label="' + (fin ? 'Reabrir tarea' : 'Finalizar tarea') + '"' +
        (busy ? ' disabled' : '') + '>' + (busy ? '<span class="spinner dark"></span>' : CHECK_SVG) + '</button>'
      : '<span class="tg-lock" title="La ' + h(t.tipo) + ' ' + h(o.codigo) + ' está finalizada: sus tareas son de solo lectura.">' + LOCK_SVG + '</span>';

    var meta = [];
    if (t.fechaInicio) meta.push('Inicio ' + h(t.fechaInicio));
    if (obs.length) meta.push(obs.length + ' observaci' + (obs.length === 1 ? 'ón' : 'ones'));
    // Último cambio (ACTUALIZADO POR/EN); el detalle completo, en el botón de historial.
    if (t.actualizadoPor) meta.push('Últ. cambio: ' + h(t.actualizadoPor) + (t.actualizadoEn ? ' · ' + h(t.actualizadoEn) : ''));

    var actions;
    if (state.confirm && state.confirm.key === key) {
      actions = state.confirm.accion === 'delete'
        ? '<div class="tg-confirm"><span class="cell-muted">¿Eliminar la tarea?</span>' +
          '<button type="button" class="btn btn-sm btn-danger" data-action="confirm-delete" data-key="' + k + '">Sí</button>' +
          '<button type="button" class="btn btn-sm btn-ghost" data-action="cancel-confirm">No</button></div>'
        : '<div class="tg-confirm"><span class="cell-muted">Es la última pendiente: la OIS quedará Finalizada y de solo lectura.</span>' +
          '<button type="button" class="btn btn-sm btn-success" data-action="confirm-finalizar" data-key="' + k + '">Finalizar</button>' +
          '<button type="button" class="btn btn-sm btn-ghost" data-action="cancel-confirm">No</button></div>';
    } else {
      actions = '<div class="tg-actions">' +
        (editable ? '<button type="button" class="btn btn-sm btn-icon-edit" data-action="edit" data-key="' + k + '" title="Editar tarea" aria-label="Editar tarea"' + (busy ? ' disabled' : '') + '>' + EDIT_SVG + '</button>' : '') +
        '<button type="button" class="btn btn-sm btn-icon-view" data-action="historial" data-key="' + k + '" title="Historial de cambios" aria-label="Historial de cambios">' + HISTORY_SVG + '</button>' +
        '<button type="button" class="btn btn-sm btn-icon-view" data-action="ver-orden" data-key="' + k + '" title="Abrir la ' + h(t.tipo) + ' ' + h(o.codigo) + '" aria-label="Abrir la orden">' + VIEW_SVG + '</button>' +
        (editable ? '<button type="button" class="btn btn-sm btn-icon-delete" data-action="delete" data-key="' + k + '" title="Eliminar tarea" aria-label="Eliminar tarea"' + (busy ? ' disabled' : '') + '>' + TRASH_SVG + '</button>' : '') +
        '</div>';
    }

    return '<tr class="tg-row' + (fin ? ' is-finalizada' : '') + (editable ? ' is-editable' : '') + '" data-key="' + k + '">' +
      '<td class="tg-col-check">' + check + '</td>' +
      '<td class="tg-col-tarea"><div class="tg-tarea-title"' + (obs.length ? ' title="' + h(obs.join('\n')) + '"' : '') + '>' + h(t.tarea) + '</div>' +
        (meta.length ? '<div class="tg-tarea-meta">' + meta.join(' · ') + '</div>' : '') + '</td>' +
      '<td><div class="cell-cliente"><span class="tg-orden"><span class="orden-tag orden-tag-' + h(t.tipo.toLowerCase()) + '">' + h(t.tipo) + '</span>' +
        '<span class="cell-mono">' + h(o.codigo || '—') + '</span></span>' +
        '<span class="cliente-contacto">' + h(o.clienteNombre || '') + '</span></div></td>' +
      '<td>' + h(t.responsable || '—') + '</td>' +
      '<td>' + entregaHtml(t) + '</td>' +
      '<td>' + estadoBadge(t) + '</td>' +
      '<td class="tg-col-actions">' + actions + '</td>' +
      '</tr>';
  }

  function renderPagination(total) {
    var start = total ? (state.page - 1) * state.pageSize + 1 : 0;
    var end = Math.min(state.page * state.pageSize, total);
    $('tg-page-info').textContent = total ? ('Mostrando ' + start + '–' + end + ' de ' + total + ' tarea' + (total === 1 ? '' : 's')) : 'Sin resultados';
    $('tg-prev').disabled = state.page <= 1;
    $('tg-next').disabled = end >= total;
  }

  // ---------------- Selects dependientes del snapshot ----------------

  function setSelectValueOrReset(sel, value, filterKey) {
    sel.value = value;
    if (sel.value !== value) { sel.value = ''; state.filters[filterKey] = ''; }
  }

  function populateSelects() {
    // Responsable: "Mis tareas" (si se pudo identificar al usuario) + empleados
    // + responsables que ya no están en PERSONAL_KGP pero tienen tareas.
    var respSel = $('tg-filter-responsable');
    var personas = {};
    data.empleados.forEach(function (e) { personas[String(e.idEmpleado)] = e.nombre || String(e.idEmpleado); });
    data.tareas.forEach(function (t) {
      if (t.idEmpleado && !personas[String(t.idEmpleado)]) personas[String(t.idEmpleado)] = t.responsable || String(t.idEmpleado);
    });
    var ids = Object.keys(personas).sort(function (a, b) { return cmpStr(personas[a], personas[b]); });
    var html = '<option value="">Todos los responsables</option>';
    if (data.yo && personas[String(data.yo)]) {
      html += '<option value="' + YO + '">Mis tareas (' + h(personas[String(data.yo)]) + ')</option>';
    }
    html += ids.map(function (id) { return '<option value="' + h(id) + '">' + h(personas[id]) + '</option>'; }).join('');
    respSel.innerHTML = html;
    setSelectValueOrReset(respSel, state.filters.responsable, 'responsable');

    // Orden: agrupadas por tipo.
    var ordSel = $('tg-filter-orden');
    var grupos = ['OIS', 'OIP'].map(function (tipo) {
      var lista = data.ordenes.filter(function (o) { return o.tipo === tipo; })
        .sort(function (a, b) { return cmpStr(a.codigo, b.codigo); });
      if (!lista.length) return '';
      return '<optgroup label="' + tipo + '">' + lista.map(function (o) {
        return '<option value="' + h(okey(o.tipo, o.idOrden)) + '">' + h(o.codigo + (o.clienteNombre ? ' — ' + o.clienteNombre : '')) + '</option>';
      }).join('') + '</optgroup>';
    }).join('');
    ordSel.innerHTML = '<option value="">Todas las órdenes</option>' + grupos;
    setSelectValueOrReset(ordSel, state.filters.orden, 'orden');
  }

  /** Lleva los controles al estado de state.filters (tras quitar un chip o limpiar filtros). */
  function syncControls() {
    $('tg-search').value = state.filters.q;
    Object.keys(CHIP_SELECTS).forEach(function (k) { $(CHIP_SELECTS[k]).value = state.filters[k]; });
    $('tg-sort').value = state.sort;
    $('tg-page-size').value = String(state.pageSize);
  }

  // ---------------- Preferencias del usuario (solo este navegador) ----------------

  function loadPrefs() {
    var p = KGP.localCache.get(PREFS_KEY) || {};
    if (typeof p.responsable === 'string') state.filters.responsable = p.responsable;
    if (typeof p.sort === 'string') state.sort = p.sort;
    if ([20, 50, 100].indexOf(p.pageSize) !== -1) state.pageSize = p.pageSize;
  }

  function savePrefs() {
    KGP.localCache.set(PREFS_KEY, { responsable: state.filters.responsable, sort: state.sort, pageSize: state.pageSize });
  }

  // ---------------- Carga ----------------

  KGP.tareas.onEnter = function () {
    wireEvents();
    if (!state.everLoaded) {
      state.everLoaded = true;
      loadPrefs();
      var cached = KGP.localCache.get(CACHE_KEY);
      if (cached && Array.isArray(cached.tareas)) {
        loadData(cached, true);
        showContent();
        fetchSnapshot();
        return;
      }
      fetchSnapshot(); // sin caché: se ve #tg-loading hasta que llegue
      return;
    }
    if (state.stale || !state.loaded) {
      state.stale = false;
      fetchSnapshot();
    }
  };

  /** Lo llaman "Gestionar OIS/OIP" tras guardar: la próxima entrada a esta vista refresca en segundo plano. */
  KGP.tareas.markStale = function () { state.stale = true; };

  function fetchSnapshot() {
    var token = ++fetchToken;
    var seqAlSalir = writeSeq;
    setRefreshSpinner(true);
    return KGP.apiCall('api_listTareas', []).then(function (snap) {
      if (token !== fetchToken) return;
      // Si una escritura terminó (o sigue en curso) mientras esta consulta
      // viajaba, el snapshot puede no incluirla: se descarta y se pide otro
      // para no "deshacer" en pantalla un cambio ya guardado.
      if (seqAlSalir !== writeSeq || Object.keys(pendingIds).length) {
        refetchTrasEscrituras = true;
        refetchSiLibre();
        return;
      }
      state.loaded = true;
      KGP.localCache.set(CACHE_KEY, snap);
      loadData(snap, false);
    }).catch(function (err) {
      if (token !== fetchToken) return;
      if (!state.loaded && !data.tareas.length) {
        $('tg-tbody').innerHTML = '<tr><td colspan="7" class="empty-state">No se pudo cargar el listado de tareas. Usa "Actualizar" para reintentar.</td></tr>';
      }
      KGP.toast('No se pudieron cargar las tareas: ' + KGP.friendlyError(err), 'error', 6000);
    }).finally(function () {
      if (token !== fetchToken) return;
      setRefreshSpinner(false);
      showContent();
    });
  }

  function loadData(snap, fromCache) {
    data.hoy = (!fromCache && snap.hoy) ? snap.hoy : todayISO();
    data.yo = snap.yo || '';
    data.tareas = (snap.tareas || []).slice();
    data.ordenes = snap.ordenes || [];
    data.empleados = snap.empleados || [];
    data.limites = snap.limites || data.limites;
    ordenIdx = {};
    data.ordenes.forEach(function (o) { ordenIdx[okey(o.tipo, o.idOrden)] = o; });
    if (state.confirm && !data.tareas.some(function (t) { return tkey(t) === state.confirm.key; })) state.confirm = null;
    populateSelects();
    syncControls();
    render();
  }

  /** Reescribe la caché local con lo que hay en pantalla (tras una escritura), para que un F5 no muestre el dato de antes. */
  function persistCache() {
    KGP.localCache.set(CACHE_KEY, {
      hoy: data.hoy, yo: data.yo, tareas: data.tareas, ordenes: data.ordenes,
      empleados: data.empleados, limites: data.limites
    });
  }

  /** Pide el snapshot descartado en cuanto no quede ninguna escritura en curso. */
  function refetchSiLibre() {
    if (!refetchTrasEscrituras || Object.keys(pendingIds).length) return;
    refetchTrasEscrituras = false;
    setTimeout(fetchSnapshot, 0);
  }

  function showContent() {
    $('tg-loading').hidden = true;
    $('tg-content').hidden = false;
  }

  function setRefreshSpinner(show) {
    var el = $('tg-refresh-spinner');
    if (el) el.style.display = show ? 'inline-block' : 'none';
  }

  // ---------------- Escrituras ----------------

  function findTarea(key) {
    return data.tareas.filter(function (t) { return tkey(t) === key; })[0] || null;
  }

  /** Lo común tras cualquier escritura exitosa: estado de la orden, documento, otras vistas y caché. */
  function afterWrite(res) {
    writeSeq++;
    var o = ordenIdx[okey(res.tipo, res.idOrden)];
    if (o) {
      var seCerro = !o.cerrada && res.ordenCerrada;
      o.estado = res.ordenEstado;
      o.cerrada = !!res.ordenCerrada;
      if (seCerro) KGP.toast('La OIS ' + res.codigoOrden + ' quedó Finalizada: todas sus tareas están cerradas.', 'success', 6000);
    }
    // La OIS acaba de quedar Finalizada: aviso a contabilidad (con copias a elegir).
    if (res.ordenFinalizada) KGP.mailCc.avisarOisFinalizada(res.idOrden, res.codigoOrden);
    scheduleDocRegen(res.tipo, res.idOrden, res.codigoOrden);
    if (res.tipo === 'OIS' && KGP.ois.markStale) KGP.ois.markStale(res.idOrden);
    if (res.tipo === 'OIP' && KGP.oip.markStale) KGP.oip.markStale(res.idOrden);
    persistCache();
  }

  function handleWriteError(err, prefijo) {
    if (err && err.code === 'VALIDATION' && Array.isArray(err.details) && err.details.length) {
      KGP.toast(err.details.slice(0, 3).join(' · '), 'error', 7000);
    } else {
      KGP.toast(prefijo + ': ' + KGP.friendlyError(err), 'error', 7000);
    }
    // La tarea o la orden cambiaron en otra vista/otro usuario: resincronizar
    // (lo dispara refetchSiLibre en el finally de la escritura, cuando ya no
    // queda ninguna en curso).
    if (err && (err.code === 'NOT_FOUND' || err.code === 'CONFLICT')) refetchTrasEscrituras = true;
  }

  /** ¿Finalizar esta tarea dejaría su OIS sin tareas pendientes (y por lo tanto cerrada)? */
  function cerrariaOrden(t) {
    if (t.tipo !== 'OIS') return false;
    return data.tareas.every(function (x) {
      return x.tipo !== t.tipo || x.idOrden !== t.idOrden || tkey(x) === tkey(t) || x.estado === ESTADO_FINALIZADA;
    });
  }

  function toggleEstado(t) {
    var nuevo = t.estado === ESTADO_FINALIZADA ? ESTADO_EN_CURSO : ESTADO_FINALIZADA;
    if (nuevo === ESTADO_FINALIZADA && cerrariaOrden(t)) {
      state.confirm = { key: tkey(t), accion: 'finalizar' };
      render();
      return;
    }
    setEstado(t, nuevo);
  }

  /** Cambio optimista: la fila cambia de inmediato y vuelve atrás si el servidor lo rechaza. */
  function setEstado(t, nuevo) {
    var key = tkey(t);
    var previo = t.estado;
    t.estado = nuevo;
    pendingIds[key] = true;
    state.confirm = null;
    render();
    KGP.apiCall('api_setTareaEstado', [t.tipo, t.idOrden, t.idTarea, nuevo], WRITE_OPTS).then(function (res) {
      afterWrite(res);
      KGP.toast(nuevo === ESTADO_FINALIZADA ? 'Tarea finalizada.' : 'Tarea reabierta.', 'success');
    }).catch(function (err) {
      t.estado = previo;
      handleWriteError(err, 'No se pudo actualizar la tarea');
    }).finally(function () {
      delete pendingIds[key];
      render();
      refetchSiLibre();
    });
  }

  function eliminar(t) {
    var key = tkey(t);
    pendingIds[key] = true;
    state.confirm = null;
    render();
    KGP.apiCall('api_deleteTarea', [t.tipo, t.idOrden, t.idTarea], WRITE_OPTS).then(function (res) {
      data.tareas = data.tareas.filter(function (x) { return tkey(x) !== key; });
      var o = ordenDe(t);
      if (o) o.numTareas = Math.max(0, (o.numTareas || 0) - 1);
      afterWrite(res);
      KGP.toast('Tarea eliminada.', 'success');
    }).catch(function (err) {
      handleWriteError(err, 'No se pudo eliminar la tarea');
    }).finally(function () {
      delete pendingIds[key];
      render();
      refetchSiLibre();
    });
  }

  /** Órdenes a las que se les puede agregar una tarea: abiertas y por debajo del tope de su tipo. */
  function ordenesDisponibles() {
    return data.ordenes.filter(function (o) {
      return !o.cerrada && (o.numTareas || 0) < (data.limites[o.tipo] || 0);
    }).sort(function (a, b) { return cmpStr(a.tipo, b.tipo) || cmpStr(a.codigo, b.codigo); });
  }

  function openTareaModal(t) {
    var opts = {
      empleados: data.empleados,
      initial: t || null,
      onSave: function (datos) { return guardarTarea(t, datos); }
    };
    if (t) {
      var o = ordenDe(t);
      if (!o) return; // tarea de una orden que ya no está en el snapshot: "Actualizar" la quita
      opts.ordenes = [o];
      opts.ordenFija = o;
    } else {
      opts.ordenes = ordenesDisponibles();
      if (!opts.ordenes.length) {
        KGP.toast('No hay OIS ni OIP abiertas a las que se les pueda agregar tareas.', 'warning', 6000);
        return;
      }
      // Preselección a partir de los filtros activos (si filtras una orden,
      // "Nueva tarea" ya viene con esa orden elegida).
      var filtroOrden = state.filters.orden ? ordenIdx[state.filters.orden] : null;
      if (filtroOrden && opts.ordenes.indexOf(filtroOrden) !== -1) {
        opts.tipoDefault = filtroOrden.tipo;
        opts.idOrdenDefault = filtroOrden.idOrden;
      } else if (state.filters.tipo) {
        opts.tipoDefault = state.filters.tipo;
      }
      opts.idEmpleadoDefault = responsableFiltro() || data.yo;
      opts.fechaInicioDefault = data.hoy;
    }
    KGP.tareaModal.open(opts);
  }

  /**
   * onSave del popup: devuelve la Promise para que el popup espere (y siga abierto si falla).
   * Una tarea NUEVA avisa por correo a su responsable: antes se elige quién
   * más recibe copia; cancelar deja el popup abierto sin guardar nada.
   */
  function guardarTarea(t, datos) {
    if (t) return enviarTarea(t, datos, []);
    return KGP.mailCc.pedir({
      titulo: 'Nueva tarea',
      descripcion: 'El responsable recibirá un correo avisándole de la tarea. Elige quién más recibe una copia.',
      para: 'el responsable de la tarea',
      confirmar: 'Guardar tarea'
    }).then(function (cc) {
      if (!cc) throw new Error('Envío cancelado'); // el popup sigue abierto; nadie lo toasta
      return enviarTarea(t, datos, cc);
    });
  }

  function enviarTarea(t, datos, cc) {
    var payload = {
      tipo: t ? t.tipo : datos.tipo,
      idOrden: t ? t.idOrden : datos.idOrden,
      idTarea: t ? t.idTarea : '',
      tarea: datos.tarea,
      idEmpleado: datos.idEmpleado,
      tipoResponsable: datos.tipoResponsable,
      fechaInicio: datos.fechaInicio,
      fechaEntrega: datos.fechaEntrega,
      estado: t ? t.estado : ESTADO_EN_CURSO,
      observacion: datos.observacion,
      cc: cc
    };
    // Un alta también cuenta como escritura en curso (clave temporal): así un
    // snapshot que salió antes de que termine se descarta en vez de pisarla.
    var key = t ? tkey(t) : '__nueva__:' + (++localSeq);
    pendingIds[key] = true;
    render();

    return KGP.apiCall('api_saveTarea', [payload], WRITE_OPTS).then(function (res) {
      var dto = Object.assign({}, res.tarea, { tipo: res.tipo, idOrden: res.idOrden });
      var tarea;
      if (t) {
        // Si el listado se refrescó mientras el popup estaba abierto, `t` ya
        // no es el objeto que se pinta: se actualiza el vigente.
        tarea = findTarea(key) || t;
        Object.assign(tarea, dto);
      } else {
        dto.fila = 1e9 + (++localSeq); // la más reciente de su hoja (orden "Inicio más reciente" como desempate)
        data.tareas.push(dto);
        tarea = dto;
        var o = ordenIdx[okey(res.tipo, res.idOrden)];
        if (o) o.numTareas = (o.numTareas || 0) + 1;
      }
      afterWrite(res);
      var oculta = !(cumpleBase(tarea) && cumpleEstado(tarea, state.filters.estado));
      KGP.toast((t ? 'Tarea actualizada.' : 'Tarea agregada a la ' + res.tipo + ' ' + res.codigoOrden + '.') +
        (oculta ? ' No aparece en la tabla por los filtros activos.' : ''), 'success', oculta ? 6000 : 4200);
    }).catch(function (err) {
      handleWriteError(err, 'No se pudo guardar la tarea');
      throw err;
    }).finally(function () {
      delete pendingIds[key];
      render();
      refetchSiLibre();
    });
  }

  function verHistorial(t) {
    var o = ordenDe(t) || {};
    KGP.historialTareas.open({ tipo: t.tipo, idTarea: t.idTarea, titulo: 'Historial de la tarea',
      subtitulo: t.tarea + (o.codigo ? ' · ' + t.tipo + ' ' + o.codigo : '') });
  }

  function verOrden(t) {
    if (t.tipo === 'OIS' && KGP.ois.openDetail) KGP.ois.openDetail(t.idOrden);
    else if (t.tipo === 'OIP' && KGP.oip.openDetail) KGP.oip.openDetail(t.idOrden);
  }

  // ---------------- Documentos de las órdenes (segundo plano) ----------------

  /**
   * Las tareas salen en el documento de su orden, así que cada cambio lo deja
   * desactualizado. En vez de regenerarlo en cada clic (varios segundos de
   * Drive por llamada), se encola por orden con un debounce corto: 5 tareas
   * finalizadas seguidas de la misma OIS = 1 regeneración. Una orden nunca se
   * regenera dos veces en paralelo; si cambia mientras se regenera, se vuelve
   * a encolar y corre al terminar la anterior.
   */
  var docQueue = { pendientes: {}, enCurso: {}, errores: {}, timer: null };

  function scheduleDocRegen(tipo, idOrden, codigo) {
    var key = okey(tipo, idOrden);
    docQueue.pendientes[key] = { tipo: tipo, idOrden: idOrden, codigo: codigo };
    delete docQueue.errores[key];
    clearTimeout(docQueue.timer);
    docQueue.timer = setTimeout(processDocQueue, DOC_DEBOUNCE_MS);
    renderDocStatus();
  }

  function processDocQueue() {
    clearTimeout(docQueue.timer);
    docQueue.timer = null;
    Object.keys(docQueue.pendientes).forEach(function (key) {
      if (docQueue.enCurso[key]) return; // se reintenta cuando termine la que está corriendo
      var job = docQueue.pendientes[key];
      delete docQueue.pendientes[key];
      docQueue.enCurso[key] = job;
      var fn = job.tipo === 'OIS' ? 'api_regenerateOisDocument' : 'api_regenerateOipDocument';
      KGP.apiCall(fn, [job.idOrden]).catch(function (err) {
        if (!docQueue.pendientes[key]) docQueue.errores[key] = Object.assign({ mensaje: KGP.friendlyError(err) }, job);
      }).finally(function () {
        delete docQueue.enCurso[key];
        if (docQueue.pendientes[key]) processDocQueue();
        renderDocStatus();
      });
    });
    renderDocStatus();
  }

  function docQueueOcupada() {
    return Object.keys(docQueue.pendientes).length + Object.keys(docQueue.enCurso).length;
  }

  function renderDocStatus() {
    var el = $('tg-doc-status');
    if (!el) return;
    var activos = Object.keys(docQueue.pendientes).map(function (k) { return docQueue.pendientes[k]; })
      .concat(Object.keys(docQueue.enCurso).map(function (k) { return docQueue.enCurso[k]; }));
    var errores = Object.keys(docQueue.errores).map(function (k) { return docQueue.errores[k]; });
    el.classList.toggle('is-error', !activos.length && !!errores.length);
    if (activos.length) {
      el.innerHTML = '<span class="spinner dark"></span><span>Actualizando ' +
        (activos.length === 1 ? 'el documento de ' + h(activos[0].codigo) : activos.length + ' documentos') + '…</span>';
    } else if (errores.length) {
      el.innerHTML = '<span title="' + h(errores.map(function (e) { return e.codigo + ': ' + e.mensaje; }).join('\n')) + '">' +
        'No se pudo actualizar el documento de ' + h(errores.map(function (e) { return e.codigo; }).join(', ')) + '.</span>' +
        '<button type="button" class="btn btn-sm" data-doc-retry>Reintentar</button>';
    } else {
      el.innerHTML = '';
    }
  }

  function retryDocs() {
    Object.keys(docQueue.errores).forEach(function (key) {
      var e = docQueue.errores[key];
      docQueue.pendientes[key] = { tipo: e.tipo, idOrden: e.idOrden, codigo: e.codigo };
    });
    docQueue.errores = {};
    processDocQueue();
  }

  // ---------------- Wiring ----------------

  function debounce(fn, ms) {
    var timer;
    return function () {
      var args = arguments;
      clearTimeout(timer);
      timer = setTimeout(function () { fn.apply(null, args); }, ms);
    };
  }

  function setFilter(key, value) {
    state.filters[key] = value;
    state.page = 1;
    state.confirm = null;
    if (key === 'responsable') savePrefs();
    render();
  }

  function wireEvents() {
    if (eventsWired) return;
    eventsWired = true;

    $('tg-search').addEventListener('input', debounce(function (e) { setFilter('q', e.target.value.trim()); }, 250));
    Object.keys(CHIP_SELECTS).forEach(function (k) {
      $(CHIP_SELECTS[k]).addEventListener('change', function (e) { setFilter(k, e.target.value); });
    });
    $('tg-sort').addEventListener('change', function (e) { state.sort = e.target.value; state.page = 1; savePrefs(); render(); });
    $('tg-page-size').addEventListener('change', function (e) { state.pageSize = Number(e.target.value); state.page = 1; savePrefs(); render(); });
    $('tg-prev').addEventListener('click', function () { if (state.page > 1) { state.page--; render(); } });
    $('tg-next').addEventListener('click', function () { state.page++; render(); });

    $('tg-refresh-btn').addEventListener('click', function () { fetchSnapshot(); });
    $('tg-nueva-btn').addEventListener('click', function () { openTareaModal(null); });

    $('tg-kpis').addEventListener('click', function (e) {
      var card = e.target.closest('[data-kpi]');
      if (!card) return;
      var id = card.getAttribute('data-kpi');
      // Segundo clic sobre el KPI activo = quitar el filtro de estado.
      setFilter('estado', state.filters.estado === id ? '' : id);
      syncControls();
    });

    $('tg-chips').addEventListener('click', function (e) {
      var chip = e.target.closest('[data-chip]');
      if (!chip) return;
      var k = chip.getAttribute('data-chip');
      if (k === '__all__') {
        Object.keys(state.filters).forEach(function (f) { state.filters[f] = ''; });
        savePrefs();
      } else {
        state.filters[k] = '';
        if (k === 'responsable') savePrefs();
      }
      state.page = 1;
      syncControls();
      render();
    });

    $('tg-tbody').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-action]');
      if (btn) {
        var action = btn.getAttribute('data-action');
        if (action === 'clear-filters') {
          Object.keys(state.filters).forEach(function (f) { state.filters[f] = ''; });
          savePrefs();
          state.page = 1;
          syncControls();
          render();
          return;
        }
        if (action === 'cancel-confirm') { state.confirm = null; render(); return; }
        var t = findTarea(btn.getAttribute('data-key'));
        if (!t) return;
        if (action === 'toggle') toggleEstado(t);
        else if (action === 'confirm-finalizar') setEstado(t, ESTADO_FINALIZADA);
        else if (action === 'edit') openTareaModal(t);
        else if (action === 'ver-orden') verOrden(t);
        else if (action === 'historial') verHistorial(t);
        else if (action === 'delete') { state.confirm = { key: tkey(t), accion: 'delete' }; render(); }
        else if (action === 'confirm-delete') eliminar(t);
        return;
      }
      // Clic en cualquier otra parte de una fila editable = editar la tarea.
      var row = e.target.closest('tr.tg-row.is-editable');
      if (!row || state.confirm) return;
      var key = row.getAttribute('data-key');
      var tarea = findTarea(key);
      if (tarea && !pendingIds[key]) openTareaModal(tarea);
    });

    $('tg-doc-status').addEventListener('click', function (e) {
      if (e.target.closest('[data-doc-retry]')) retryDocs();
    });

    // Si se cierra o recarga la pestaña con regeneraciones pendientes, se
    // envían ya (no esperan el debounce) y el navegador pide confirmación.
    window.addEventListener('beforeunload', function (e) {
      if (!docQueueOcupada()) return;
      if (Object.keys(docQueue.pendientes).length) processDocQueue();
      e.preventDefault();
      e.returnValue = '';
    });
  }

}(window.KGP));
</script>
