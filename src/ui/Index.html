<!-- ---------- Popup: copias (CC) de un correo ----------
     GLOBAL: lo maneja KGP.mailCc (ui/JsCore.js.html). Se abre antes de toda
     acción que envía un correo (cotización creada/aprobada/rechazada, tarea
     nueva, OIS finalizada) para elegir quién más lo recibe en copia: personas
     de la BD o correos escritos a mano. No lo dupliques en una vista: usa
     KGP.mailCc.pedir(). -->
<div class="modal-overlay" id="cc-modal-overlay">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="cc-modal-title">
    <div class="modal-header">
      <h2 id="cc-modal-title">Enviar copia del correo</h2>
      <button type="button" class="modal-close" id="cc-modal-close" aria-label="Cerrar">✕</button>
    </div>
    <div class="modal-body">
      <p class="cc-desc" id="cc-modal-desc"></p>
      <p class="cc-para" id="cc-modal-para"></p>

      <div class="cc-section-title">Con copia a (opcional)</div>
      <input type="search" id="cc-search" class="cc-search" placeholder="Buscar persona por nombre o correo…" autocomplete="off" aria-label="Buscar persona">
      <div class="cc-list" id="cc-list"></div>

      <div class="cc-section-title">Otros correos (que no están en la base de datos)</div>
      <div class="cc-extra-row">
        <input type="email" id="cc-extra-input" class="cc-search" placeholder="correo@ejemplo.com (varios: separados por coma)" autocomplete="off" aria-label="Agregar otro correo">
        <button type="button" class="btn btn-sm" id="cc-extra-add">Agregar</button>
      </div>
      <div class="cc-extra-err" id="cc-extra-err" role="alert"></div>
      <div class="cc-chips" id="cc-extra-chips"></div>

      <div class="cc-count" id="cc-count" aria-live="polite"></div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-sm" id="cc-cancel">Cancelar</button>
      <button type="button" class="btn btn-primary" id="cc-ok">Continuar</button>
    </div>
  </div>
</div>

<!-- ---------- Popup: historial de cambios de tareas ----------

  </div>
</div>
