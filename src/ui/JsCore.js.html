<script>
/**
 * Núcleo de la UI: namespace global KGP con el wrapper de google.script.run
 * (KGP.apiCall), el router en memoria (KGP.nav — no location.hash, el hash
 * del navegador no es accesible dentro del iframe sandbox de Apps Script),
 * el sistema de toasts y el indicador de conexión.
 *
 * JsCotizacion.js.html y JsDashboard.js.html registran KGP.cotizacion y
 * KGP.dashboard con {bootstrap, onEnter, onLeave} antes de que corra
 * KGP.init() (ver Index.html: los <script> se incluyen en orden y init()
 * se llama al final).
 */
window.KGP = window.KGP || {};

(function (KGP) {
  'use strict';

  KGP.state = { view: null };
  KGP.cotizacion = KGP.cotizacion || {};
  KGP.dashboard = KGP.dashboard || {};
  KGP.gestion = KGP.gestion || {};
  KGP.ois = KGP.ois || {};
  KGP.oip = KGP.oip || {};
  KGP.tareas = KGP.tareas || {};
  KGP.empleados = KGP.empleados || {};
  KGP.clientes = KGP.clientes || {};
  KGP.config = KGP.config || {};

  /**
   * Parámetro de la app (00_Config.js / cfgs_clientConfig_), que doGet inyecta en
   * window.KGP_CONFIG en cada carga de la página (06_ConfigSheet.js,
   * cfgs_clientConfig_). `def` = valor si no llegó o no es un número válido.
   */
  KGP.cfg = function (clave, def) {
    var c = window.KGP_CONFIG || {};
    var v = Number(c[clave]);
    return (c[clave] === undefined || c[clave] === null || c[clave] === '' || !isFinite(v)) ? def : v;
  };

  /** Igual que KGP.cfg pero para textos (etiquetas, valores de listas). */
  KGP.cfgTexto = function (clave, def) {
    var v = (window.KGP_CONFIG || {})[clave];
    return (v === undefined || v === null || String(v).trim() === '') ? def : String(v);
  };

  // ---------------- apiCall: wrapper sobre google.script.run ----------------

  /**
   * fn: nombre de la función api_* (string). args: array de argumentos.
   * opts: { retryOn: [codigos], retryDelays: [ms,...], timeoutMs }.
   * Devuelve una Promise que resuelve con `data` o rechaza con {code,message}.
   *
   * google.script.run no tiene timeout propio: se corre una carrera contra
   * un timeout local (90s por defecto). Si gana el timeout, la llamada al
   * servidor sigue en curso igualmente (no se puede cancelar); el llamador
   * decide si reintenta (createQuotation reintenta con el MISMO requestId,
   * nunca a ciegas, gracias a la idempotencia del servidor).
   */
  KGP.apiCall = function (fn, args, opts) {
    opts = opts || {};
    var retryOn = opts.retryOn || ['BUSY', 'TRANSPORT'];
    var retryDelays = opts.retryDelays || [2000, 5000];
    var timeoutMs = opts.timeoutMs || 90000;

    function attempt(n) {
      var timer = null;
      var callPromise = new Promise(function (resolve, reject) {
        google.script.run
          .withSuccessHandler(function (r) {
            KGP.setConn('ok');
            if (r && r.ok) {
              resolve(r.data);
            } else {
              reject((r && r.error) || { code: 'INTERNAL', message: 'Respuesta inválida del servidor.' });
            }
          })
          .withFailureHandler(function (e) {
            KGP.setConn('error');
            reject({ code: 'TRANSPORT', message: (e && e.message) || String(e) });
          })
          [fn].apply(null, args || []);
      });

      var timeoutPromise = new Promise(function (_, reject) {
        timer = setTimeout(function () {
          reject({ code: 'TIMEOUT', message: 'La operación tardó demasiado (' + Math.round(timeoutMs / 1000) + ' s).' });
        }, timeoutMs);
      });

      // El temporizador se cancela en cuanto el servidor responde: si no, cada
      // llamada dejaba un setTimeout vivo durante 90 s.
      var race = Promise.race([callPromise, timeoutPromise]);
      race.then(function () { clearTimeout(timer); }, function () { clearTimeout(timer); });

      return race.catch(function (err) {
        if (err && retryOn.indexOf(err.code) !== -1 && n < retryDelays.length) {
          return new Promise(function (resolve) { setTimeout(resolve, retryDelays[n]); })
            .then(function () { return attempt(n + 1); });
        }
        throw err;
      });
    }

    return attempt(0);
  };

  // ---------------- Indicador de conexión ----------------

  KGP.setConn = function (status) {
    var dot = document.getElementById('conn-dot');
    var label = document.getElementById('conn-label');
    if (!dot || !label) return;
    dot.className = 'conn-dot' + (status === 'error' ? ' error' : status === 'connecting' ? ' off' : '');
    label.textContent = status === 'error' ? 'Sin conexión' : status === 'connecting' ? 'Conectando…' : 'Conectado';
  };

  // ---------------- Toasts ----------------

  KGP.toast = function (message, type, durationMs) {
    var stack = document.getElementById('toast-stack');
    if (!stack) return;
    var el = document.createElement('div');
    el.className = 'toast' + (type ? ' ' + type : '');
    el.textContent = message;
    stack.appendChild(el);
    setTimeout(function () {
      el.style.transition = 'opacity 0.2s ease';
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 220);
    }, durationMs || 4200);
  };

  /** Mensaje legible a partir de un error {code,message} devuelto por apiCall. */
  KGP.friendlyError = function (err) {
    if (!err) return 'Ocurrió un error inesperado.';
    var byCode = {
      BUSY: 'El sistema está ocupado procesando otra cotización. Intenta de nuevo en unos segundos.',
      TIMEOUT: 'La operación está tardando más de lo normal. Puedes reintentar; no se duplicará nada.',
      TRANSPORT: 'Problema de conexión. Verifica tu red e intenta de nuevo.',
      SCHEMA: 'Hay un problema con la estructura de la base de datos: ' + err.message,
      SEQ_OVERFLOW: err.message
    };
    return byCode[err.code] || (err.message || 'Ocurrió un error inesperado.');
  };

  // ---------------- Router en memoria ----------------

  KGP.nav = function (view) {
    if (KGP.state.view === view) return;
    var prev = KGP.state.view;
    KGP.state.view = view;

    document.querySelectorAll('.view').forEach(function (el) {
      el.classList.toggle('active', el.id === 'view-' + view);
    });
    document.querySelectorAll('.nav-item').forEach(function (el) {
      el.classList.toggle('active', el.getAttribute('data-nav') === view);
    });

    if (prev === 'dashboard' && KGP.dashboard.onLeave) KGP.dashboard.onLeave();
    if (view === 'cotizacion' && KGP.cotizacion.onEnter) KGP.cotizacion.onEnter();
    if (view === 'dashboard' && KGP.dashboard.onEnter) KGP.dashboard.onEnter();
    if (view === 'gestion' && KGP.gestion.onEnter) KGP.gestion.onEnter();
    if (view === 'ois' && KGP.ois.onEnter) KGP.ois.onEnter();
    if (view === 'oip' && KGP.oip.onEnter) KGP.oip.onEnter();
    if (view === 'tareas' && KGP.tareas.onEnter) KGP.tareas.onEnter();
    if (view === 'empleados' && KGP.empleados.onEnter) KGP.empleados.onEnter();
    if (view === 'clientes' && KGP.clientes.onEnter) KGP.clientes.onEnter();
    if (view === 'config' && KGP.config.onEnter) KGP.config.onEnter();
  };

  // ---------------- Utilidades compartidas ----------------

  /** UUID v4 simple, suficiente como requestId de idempotencia (no criptográfico). */
  KGP.uuid = function () {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0;
      var v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  };

  KGP.escapeHtml = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  };

  // ---------------- Loader de pantalla completa ----------------

  /**
   * Oculta el loader inicial (#page-loader, visible por defecto desde el
   * HTML). Debe llamarse una vez que la vista activa terminó de cargar TODOS
   * sus datos (éxito o error, nunca debe quedar pegado). Idempotente: llamar
   * varias veces (p. ej. desde cada poll del dashboard) no tiene efecto tras
   * la primera vez, porque el elemento se elimina del DOM.
   */
  KGP.hideLoader = function () {
    var el = document.getElementById('page-loader');
    if (!el) return;
    el.classList.add('hidden');
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
  };

  // ---------------- Caché local (stale-while-revalidate) ----------------

  /**
   * Persistencia en localStorage para que Dashboard y "Gestionar cotización"
   * puedan pintar de inmediato el último dato visto (sin el loader
   * bloqueando la vista) mientras se pide en segundo plano el dato real de
   * la base de datos. Nunca es la fuente de verdad: cada vista, al entrar
   * por primera vez en la sesión, siempre dispara igual una llamada real al
   * servidor que termina reemplazando y reescribiendo esta caché — así una
   * recarga de página (o volver a abrir la pestaña) jamás se queda con un
   * dato viejo para siempre, solo evita la espera visible mientras llega.
   */
  KGP.localCache = (function () {
    var PREFIX = 'kgp:cache:';
    return {
      get: function (key) {
        try {
          var raw = localStorage.getItem(PREFIX + key);
          return raw ? JSON.parse(raw) : null;
        } catch (e) {
          return null; // localStorage no disponible (modo privado, cuota, etc.) — no crítico
        }
      },
      set: function (key, value) {
        try {
          localStorage.setItem(PREFIX + key, JSON.stringify(value));
        } catch (e) { /* no crítico */ }
      }
    };
  }());

  // ---------------- Catálogo compartido (api_bootstrap) ----------------

  /**
   * api_bootstrap trae tipos de servicio + catálogo UNSPSC + clientes +
   * estados, y lo necesitan tanto "Crear cotización" como "Gestionar
   * cotización". En vez de que cada vista lo pida por su cuenta (dos
   * round-trips cuando el usuario simplemente navega entre las dos vistas),
   * se cachea en memoria aquí y se comparte. KGP.catalog.load(true) fuerza
   * un refresco (usar tras crear una cotización o al entrar a "Gestionar",
   * donde interesa ver clientes/catálogo recién agregados).
   */
  KGP.catalog = (function () {
    var pending = null;
    var last = null;
    return {
      load: function (force) {
        if (!force && pending) return pending;
        var p = KGP.apiCall('api_bootstrap', []).then(function (res) {
          last = res;
          return res;
        }).catch(function (err) {
          // Un bootstrap fallido NO se cachea: si se dejara la promesa
          // rechazada en `pending`, cada vista que llamara load() después
          // (p. ej. abrir una cotización en "Gestionar") fallaría para siempre
          // en esa sesión sin volver a intentarlo.
          if (pending === p) pending = null;
          throw err;
        });
        pending = p;
        return pending;
      },
      current: function () { return last; }
    };
  }());

  // ---------------- Utilidades de <select> compartidas ----------------

  KGP.ui = {
    rebuildSelect: function (sel, items, valueFn, labelFn, placeholderText) {
      sel.innerHTML = '';
      var ph = document.createElement('option');
      ph.value = '';
      ph.textContent = placeholderText;
      sel.appendChild(ph);
      items.forEach(function (it) {
        var opt = document.createElement('option');
        opt.value = valueFn(it);
        opt.textContent = labelFn(it);
        sel.appendChild(opt);
      });
    },

    /**
     * <option> de un <select> por su value, o null. Recorre las opciones en
     * vez de usar querySelector('option[value="..."]'), que se rompe si el
     * valor trae comillas o barras.
     */
    findOption: function (sel, value) {
      var v = String(value);
      return Array.prototype.filter.call(sel.options, function (o) { return o.value === v; })[0] || null;
    },

    /** Inserta (o reemplaza si ya existe) una <option> sin tocar la selección actual. */
    addOption: function (sel, value, label) {
      var existing = KGP.ui.findOption(sel, value);
      if (existing) { existing.textContent = label; return existing; }
      var opt = document.createElement('option');
      opt.value = value;
      opt.textContent = label;
      sel.appendChild(opt);
      return opt;
    },

    /** addOption + deja esa opción seleccionada de inmediato (sin recargar nada del servidor). */
    addOptionAndSelect: function (sel, value, label) {
      KGP.ui.addOption(sel, value, label);
      sel.value = value;
    },

    updateOptionLabel: function (sel, value, label) {
      var opt = KGP.ui.findOption(sel, value);
      if (opt) opt.textContent = label;
    },

    clientLabel: function (c) { return c.razonSocial + (c.numeroIdentificacion ? ' — ' + c.numeroIdentificacion : ''); },
    contactoLabel: function (c) { return c.nombre + (c.cargo ? ' — ' + c.cargo : ''); },
    establecimientoLabel: function (e) { return e.nombre; },

    /**
     * "Cédula - Nombre (Cargo)" si el empleado tiene cédula registrada; si no,
     * solo el nombre. Es la etiqueta del desplegable de responsable de una
     * tarea (OIS y OIP), que el usuario pidió poder elegir por "Cédula-Nombre".
     * CEDULA es una columna opcional de PERSONAL_KGP (ver emp_rowToObj_).
     */
    empleadoLabel: function (e) {
      return (e.cedula ? e.cedula + ' - ' : '') + e.nombre + (e.cargo ? ' (' + e.cargo + ')' : '');
    },

    /**
     * Tipos de responsable de una tarea, en orden: [{valor, etiqueta}].
     * Valores y etiquetas salen de la config (CFG_().TIPO_RESPONSABLE_* /
     * ETIQUETA_RESPONSABLE_*, inyectados por doGet).
     */
    tiposResponsable: function () {
      return [
        { valor: KGP.cfgTexto('TIPO_RESPONSABLE_INTERNO', 'INTERNO'), etiqueta: KGP.cfgTexto('ETIQUETA_RESPONSABLE_INTERNO', 'Interno (KGP)') },
        { valor: KGP.cfgTexto('TIPO_RESPONSABLE_TERCERO', 'TERCERO'), etiqueta: KGP.cfgTexto('ETIQUETA_RESPONSABLE_TERCERO', 'Tercero / independiente') }
      ];
    },

    /**
     * Candidatos a responsable de una tarea a partir de api_bootstrap
     * (KGP.catalog): internos (cat.empleados, PERSONAL_KGP) + terceros
     * (cat.terceros, PERSONAL_TERCEROS), cada uno con su tipoResponsable.
     */
    responsables: function (cat) {
      var tipos = KGP.ui.tiposResponsable();
      function marcar(lista, tipo) {
        return (lista || []).map(function (e) { return Object.assign({}, e, { tipoResponsable: e.tipoResponsable || tipo }); });
      }
      return marcar((cat || {}).empleados, tipos[0].valor).concat(marcar((cat || {}).terceros, tipos[1].valor));
    },

    /** Nombres de mes en español, indexados 1-12 (mesNombre(1) === 'Enero'). */
    mesNombre: function (mes) {
      var meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
        'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
      return meses[Math.trunc(Number(mes)) - 1] || String(mes || '');
    },

    /** {tipo: codigoUnspsc} a partir de catalogoPares (misma fila = correspondencia real, ver 11_CatalogRepo.js). */
    buildUnspscMap: function (pares) {
      var map = {};
      (pares || []).forEach(function (p) { map[p.tipo] = p.codigoUnspsc; });
      return map;
    },

    wirePhoneInputs: function (scope) {
      Array.prototype.forEach.call(scope.querySelectorAll('input[type=tel]'), function (inp) {
        inp.addEventListener('input', function () {
          var digits = inp.value.replace(/\D/g, '');
          if (digits !== inp.value) inp.value = digits;
        });
      });
    },

    /** Formato contable colombiano, solo para mostrar: 12000 -> "$12.000", 2280.5 -> "$2.280,50". '' / null -> "—". */
    formatMoney: function (n) {
      if (n === '' || n == null || isNaN(Number(n))) return '—';
      var v = Math.round(Math.abs(Number(n)) * 100) / 100;
      var entero = Math.floor(v);
      var dec = Math.round((v - entero) * 100);
      var txt = String(entero).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return (Number(n) < 0 ? '-' : '') + '$' + txt + (dec ? ',' + String(dec).padStart(2, '0') : '');
    },

    /** Número entero a partir de un texto con formato ("$12.000" -> 12000); '' si no hay dígitos. */
    parseDigits: function (text) {
      var digits = String(text == null ? '' : text).replace(/\D/g, '');
      return digits ? Number(digits) : '';
    },

    /**
     * Campo de moneda: solo acepta dígitos (hasta maxDigits) y se muestra
     * formateado ("$120.000") mientras se escribe, conservando la posición
     * del cursor. El valor real se lee con KGP.ui.parseDigits(input.value).
     */
    wireMoneyInput: function (input, maxDigits, onChange) {
      input.addEventListener('input', function () {
        var caret = input.selectionStart == null ? input.value.length : input.selectionStart;
        var digitsBeforeCaret = input.value.slice(0, caret).replace(/\D/g, '').replace(/^0+(?=\d)/, '').length;
        var digits = input.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, maxDigits);
        input.value = digits ? KGP.ui.formatMoney(Number(digits)) : '';
        var pos = input.value.length;
        if (digitsBeforeCaret < digits.length) {
          var seen = 0;
          for (var i = 0; i < input.value.length; i++) {
            if (/\d/.test(input.value[i])) seen++;
            if (seen === digitsBeforeCaret) { pos = i + 1; break; }
          }
          if (digitsBeforeCaret === 0) pos = 1; // justo después del "$"
        }
        try { input.setSelectionRange(pos, pos); } catch (e) { /* input sin foco */ }
        if (onChange) onChange();
      });
    }
  };

  // ---------------- Modal genérico: Cliente / Contacto / Establecimiento ----------------

  /**
   * Un solo modal compartido (#modal-overlay en Index.html/ViewCotizacion.html)
   * reutilizado por "Crear cotización" y "Gestionar cotización": ambas vistas
   * necesitan el mismo formulario de alta/edición rápida de cliente,
   * solicitante/encargado (contacto) y establecimiento. El llamador decide
   * QUÉ hacer con el resultado (a qué <select> insertar la opción, qué
   * estado local actualizar) pasando `onSave(datos) -> Promise`; este módulo
   * solo se encarga de mostrar el formulario correcto, validar los campos
   * comunes (requerido/correo/teléfono) y el ciclo de vida del diálogo.
   */
  KGP.entityModal = (function () {
    var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/;
    var TITLES = {
      cliente: { create: 'Agregar nuevo cliente', edit: 'Editar cliente' },
      contactoSolicitante: { create: 'Agregar contacto del cliente', edit: 'Editar contacto' },
      contactoEncargado: { create: 'Agregar contacto encargado', edit: 'Editar contacto' },
      establecimiento: { create: 'Agregar establecimiento', edit: 'Editar establecimiento' },
      empleado: { create: 'Agregar empleado', edit: 'Editar empleado' }
    };
    var state = { type: null, mode: null, target: null, onSave: null };
    var wired = false;

    function capitalize_(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

    function fill(initial) {
      var body = document.getElementById('modal-body');
      Object.keys(initial || {}).forEach(function (key) {
        var el = body.querySelector('[data-f="' + key + '"]');
        if (el) el.value = initial[key] == null ? '' : initial[key];
      });
    }

    function read() {
      var body = document.getElementById('modal-body');
      var out = {};
      Array.prototype.forEach.call(body.querySelectorAll('[data-f]'), function (el) {
        out[el.getAttribute('data-f')] = el.value.trim();
      });
      return out;
    }

    function fieldEl(key) { return document.querySelector('#modal-body .field[data-field="' + key + '"]'); }
    function markInvalid(key) { var f = fieldEl(key); if (f) f.classList.add('invalid'); }
    function clearInvalid() {
      document.querySelectorAll('#modal-body .field.invalid').forEach(function (f) { f.classList.remove('invalid'); });
    }

    function validate(type, datos) {
      clearInvalid();
      var ok = true;
      function fail(key) { markInvalid(key); ok = false; }

      if (type === 'cliente') {
        if (!datos.razonSocial) fail('razonSocial');
        if (!datos.numeroIdentificacion) fail('numeroIdentificacion');
      } else if (type === 'contacto' || type === 'establecimiento' || type === 'empleado') {
        if (!datos.nombre) fail('nombre');
      }
      // Alta de empleado: todos los campos son obligatorios (en edición se
      // mantiene lo opcional para no bloquear empleados antiguos incompletos).
      if (type === 'empleado' && state.mode === 'create') {
        if (!datos.cargo) fail('cargo');
        if (!datos.telefono) fail('telefono');
        if (!datos.correo) fail('correo');
      }
      if (datos.correo && !EMAIL_RE.test(datos.correo)) fail('correo');
      if (datos.telefono && /\D/.test(datos.telefono)) fail('telefono');

      return ok;
    }

    function open(opts) {
      opts = opts || {};
      state.type = opts.type;
      state.mode = opts.mode;
      state.target = opts.target || null;
      state.onSave = opts.onSave;

      var body = document.getElementById('modal-body');
      body.innerHTML = '';
      var tpl = document.getElementById('tpl-modal-' + opts.type);
      body.appendChild(tpl.content.cloneNode(true));

      var titleKey = opts.type === 'contacto' ? ('contacto' + capitalize_(state.target)) : opts.type;
      // opts.title: título propio (p. ej. "Agregar tercero" con el formulario de empleado).
      document.getElementById('modal-title').textContent = opts.title || ((TITLES[titleKey] || {})[opts.mode]) || 'Formulario';

      if (opts.mode === 'edit' && opts.initial) fill(opts.initial);
      KGP.ui.wirePhoneInputs(body);

      document.getElementById('modal-overlay').classList.add('open');
      var firstInput = body.querySelector('input, select, textarea');
      if (firstInput) setTimeout(function () { firstInput.focus(); }, 50);
    }

    function close() {
      document.getElementById('modal-overlay').classList.remove('open');
      document.getElementById('modal-body').innerHTML = '';
      state.type = null; state.mode = null; state.target = null; state.onSave = null;
    }

    function handleSave() {
      var datos = read();
      if (!validate(state.type, datos)) {
        KGP.toast('Revisa los campos marcados en rojo.', 'error');
        return;
      }

      var btn = document.getElementById('modal-save');
      btn.disabled = true;
      btn.textContent = 'Guardando…';

      Promise.resolve(state.onSave(datos)).then(function () {
        close();
      }).catch(function () { /* el toast de error ya lo muestra el onSave específico */ })
        .finally(function () {
          btn.disabled = false;
          btn.textContent = 'Guardar';
        });
    }

    function wireGlobalEvents() {
      if (wired) return;
      wired = true;
      document.getElementById('modal-close').addEventListener('click', close);
      document.getElementById('modal-cancel').addEventListener('click', close);
      document.getElementById('modal-save').addEventListener('click', handleSave);
      document.getElementById('modal-overlay').addEventListener('click', function (e) {
        if (e.target.id === 'modal-overlay') close();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && document.getElementById('modal-overlay').classList.contains('open')) close();
      });
    }

    return { open: open, close: close, wireGlobalEvents: wireGlobalEvents, target: function () { return state.target; } };
  }());

  // ---------------- Modal genérico: Servicio (Crear cotización / Gestión) ----------------

  /**
   * Popup compartido para agregar/editar UN servicio (tipo/UNSPSC/
   * descripción + su lista de actividades). A diferencia de KGP.entityModal,
   * `onSave` nunca llama al servidor: solo recibe {tipo, codigoUnspsc,
   * descripcion, actividades[]} y el llamador decide qué hacer con eso en su
   * propio arreglo en memoria (data.servicios / detail.servicios). El
   * servicio recién agregado/editado NO se persiste en la base de datos
   * hasta que se envía el formulario completo (Crear cotización / Guardar
   * cambios) — "Cancelar" simplemente cierra sin invocar `onSave`.
   *
   * `showTarifas: true` (solo "Gestionar cotización") muestra además la
   * sección Tarifas y agrega {tarifa, cantidad, total, observaciones} al
   * objeto de `onSave`. Observaciones es acumulativo: las anteriores se
   * muestran en solo lectura y lo escrito en el textarea se agrega como una
   * línea nueva debajo de ellas (nunca las reemplaza).
   */
  KGP.servicioModal = (function () {
    var TARIFA_MAX_DIGITS = KGP.cfg('TARIFA_MAX_DIGITS', 10); // dígitos de CFG_().TARIFA_MAX
    var CANTIDAD_MAX = KGP.cfg('CANTIDAD_MAX', 99999);         // = CFG_().CANTIDAD_MAX
    var MAX_ACTIVIDADES = KGP.cfg('MAX_ACTIVIDADES', 10);      // = CFG_().LIMITS.MAX_ACTIVIDADES
    var state = { onSave: null, actividades: [], actSeq: 0, unspscMap: {}, showTarifas: false, observacionesPrevias: '' };
    var wired = false;

    function fieldEl(key) { return document.querySelector('#servicio-modal-body .field[data-field="' + key + '"]'); }
    function markInvalid(key) { var f = fieldEl(key); if (f) f.classList.add('invalid'); }
    function clearInvalid() {
      document.querySelectorAll('#servicio-modal-body .field.invalid').forEach(function (f) { f.classList.remove('invalid'); });
    }

    function renderActividades() {
      var list = document.getElementById('sm-actividades-list');
      list.innerHTML = '';
      state.actividades.forEach(function (a, idx) {
        var tpl = document.getElementById('tpl-actividad');
        var frag = tpl.content.cloneNode(true);
        var row = frag.querySelector('[data-actividad]');
        row.dataset.localId = a.localId;
        row.querySelector('[data-idx]').textContent = (idx + 1) + '.';
        var input = row.querySelector('[data-actividad-input]');
        input.value = a.texto;
        input.addEventListener('input', function () { a.texto = input.value; });
        row.querySelector('[data-remove-actividad]').addEventListener('click', function () { removeActividadRow(a.localId); });
        list.appendChild(frag);
      });
      document.getElementById('sm-act-count').textContent = '(' + state.actividades.length + '/' + MAX_ACTIVIDADES + ')';
      document.getElementById('sm-add-actividad').disabled = state.actividades.length >= MAX_ACTIVIDADES;
    }

    function addActividadRow() {
      if (state.actividades.length >= MAX_ACTIVIDADES) return;
      state.actividades.push({ localId: 'sact' + (++state.actSeq), texto: '' });
      renderActividades();
    }

    function removeActividadRow(localId) {
      state.actividades = state.actividades.filter(function (a) { return a.localId !== localId; });
      renderActividades();
    }

    function readCantidad() {
      var raw = document.getElementById('sm-cantidad').value.trim();
      if (raw === '') return '';
      return /^\d+$/.test(raw) && Number(raw) >= 1 && Number(raw) <= CANTIDAD_MAX ? Number(raw) : null;
    }

    function updateTotal() {
      var tarifa = KGP.ui.parseDigits(document.getElementById('sm-tarifa').value);
      var cantidad = readCantidad();
      var out = document.getElementById('sm-total');
      out.value = (tarifa === '' || cantidad === null) ? '—' : KGP.ui.formatMoney(tarifa * (cantidad === '' ? 1 : cantidad));
    }

    function renderObsHistorial() {
      var box = document.getElementById('sm-obs-historial');
      var lines = state.observacionesPrevias.split('\n').filter(function (l) { return l.trim(); });
      box.hidden = !lines.length;
      box.innerHTML = lines.map(function (l) { return '<div class="obs-item">' + KGP.escapeHtml(l) + '</div>'; }).join('');
    }

    function fillTarifas(initial) {
      initial = initial || {};
      var tarifa = initial.tarifa;
      document.getElementById('sm-tarifa').value = (tarifa === '' || tarifa == null) ? '' : KGP.ui.formatMoney(tarifa);
      var cantidad = initial.cantidad;
      document.getElementById('sm-cantidad').value = (cantidad === '' || cantidad == null) ? '1' : String(cantidad);
      document.getElementById('sm-obs-nueva').value = '';
      state.observacionesPrevias = String(initial.observaciones || '');
      renderObsHistorial();
      updateTotal();
    }

    function open(opts) {
      opts = opts || {};
      state.onSave = opts.onSave;
      state.showTarifas = !!opts.showTarifas;
      document.getElementById('sm-tarifas-section').hidden = !state.showTarifas;
      if (state.showTarifas) fillTarifas(opts.initial);
      state.unspscMap = opts.unspscMap || {};
      state.actividades = ((opts.initial && opts.initial.actividades) || []).map(function (texto) {
        return { localId: 'sact' + (++state.actSeq), texto: texto };
      });

      document.getElementById('servicio-modal-title').textContent = opts.initial ? 'Editar servicio' : 'Agregar servicio';
      clearInvalid();

      var tipoSel = document.getElementById('sm-tipo');
      KGP.ui.rebuildSelect(tipoSel, opts.tiposServicio || [], function (t) { return t; }, function (t) { return t; }, '— Selecciona tipo —');
      tipoSel.value = (opts.initial && opts.initial.tipo) || '';

      var unspscInput = document.getElementById('sm-unspsc');
      unspscInput.value = (tipoSel.value && state.unspscMap[tipoSel.value]) || '—';
      tipoSel.onchange = function () {
        unspscInput.value = (tipoSel.value && state.unspscMap[tipoSel.value]) || '—';
      };

      document.getElementById('sm-descripcion').value = (opts.initial && opts.initial.descripcion) || '';

      renderActividades();

      document.getElementById('servicio-modal-overlay').classList.add('open');
      setTimeout(function () { tipoSel.focus(); }, 50);
    }

    function close() {
      document.getElementById('servicio-modal-overlay').classList.remove('open');
      state.onSave = null;
      state.actividades = [];
    }

    function handleSave() {
      clearInvalid();
      var tipo = document.getElementById('sm-tipo').value;
      var descripcion = document.getElementById('sm-descripcion').value.trim();
      var ok = true;
      if (!tipo) { markInvalid('tipo'); ok = false; }
      if (!descripcion) { markInvalid('descripcion'); ok = false; }
      var cantidad = state.showTarifas ? readCantidad() : '';
      if (cantidad === null) { markInvalid('cantidad'); ok = false; }
      if (!ok) { KGP.toast('Revisa los campos marcados en rojo.', 'error'); return; }

      var unspsc = document.getElementById('sm-unspsc').value;
      var servicioData = {
        tipo: tipo,
        codigoUnspsc: unspsc === '—' ? '' : unspsc,
        descripcion: descripcion,
        actividades: state.actividades.map(function (a) { return a.texto.trim(); }).filter(function (t) { return t; })
      };

      if (state.showTarifas) {
        var tarifa = KGP.ui.parseDigits(document.getElementById('sm-tarifa').value);
        if (tarifa !== '' && cantidad === '') cantidad = 1;
        var nueva = document.getElementById('sm-obs-nueva').value.trim();
        var previas = state.observacionesPrevias.trim();
        servicioData.tarifa = tarifa;
        servicioData.cantidad = cantidad;
        servicioData.total = tarifa === '' ? '' : tarifa * cantidad;
        servicioData.observaciones = nueva ? (previas ? previas + '\n' + nueva : nueva) : previas;
      }

      var onSave = state.onSave;
      close();
      if (onSave) onSave(servicioData);
    }

    function wireGlobalEvents() {
      if (wired) return;
      wired = true;
      document.getElementById('servicio-modal-close').addEventListener('click', close);
      document.getElementById('servicio-modal-cancel').addEventListener('click', close);
      document.getElementById('servicio-modal-save').addEventListener('click', handleSave);
      document.getElementById('sm-add-actividad').addEventListener('click', addActividadRow);
      KGP.ui.wireMoneyInput(document.getElementById('sm-tarifa'), TARIFA_MAX_DIGITS, updateTotal);
      var cantidadInput = document.getElementById('sm-cantidad');
      cantidadInput.addEventListener('keydown', function (e) {
        // type=number acepta "e", "+", "-", "." y ","; la cantidad es un entero positivo.
        if (['e', 'E', '+', '-', '.', ','].indexOf(e.key) !== -1) e.preventDefault();
      });
      cantidadInput.addEventListener('input', updateTotal);
      document.getElementById('servicio-modal-overlay').addEventListener('click', function (e) {
        if (e.target.id === 'servicio-modal-overlay') close();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && document.getElementById('servicio-modal-overlay').classList.contains('open')) close();
      });
    }

    return { open: open, close: close, wireGlobalEvents: wireGlobalEvents };
  }());

  // ---------------- Modal genérico: Tarea (Gestionar OIS / Gestionar OIP) ----------------

  /**
   * Popup compartido para agregar/editar UNA tarea. Mismo contrato que
   * KGP.servicioModal: `onSave` NO llama al servidor — recibe
   * {tarea, idEmpleado, responsable, fechaInicio, fechaEntrega, observacion}
   * y el llamador decide qué hacer con eso en su propio arreglo en memoria
   * (detail.tareas). Nada llega a la base de datos hasta el "Guardar cambios"
   * de la vista; "Cancelar" cierra sin invocar `onSave`.
   *
   * El HTML (#tarea-modal-overlay) vive en ui/ViewOis.html pero es GLOBAL, no
   * está atado a esa vista — mismo criterio que las plantillas tpl-servicio /
   * tpl-modal-* de ui/ViewCotizacion.html (ver CLAUDE.md §2.1).
   *
   * OBSERVACION es acumulativa: las anteriores se muestran en solo lectura y
   * lo escrito en el textarea se agrega como una línea nueva debajo, nunca las
   * reemplaza.
   *
   * empleados: internos + terceros, cada uno con tipoResponsable (usa
   * KGP.ui.responsables(cat) o el snapshot de Gestionar tareas). El popup
   * muestra el selector Interno/Tercero y filtra el desplegable por tipo;
   * onSave recibe además `tipoResponsable`.
   *
   * opts: {empleados:[], initial: tarea|null, onSave(datos),
   *        idEmpleadoDefault, fechaInicioDefault, fechaEntregaDefault}.
   *
   * Solo "Gestionar tareas" (JsTareas.js.html) usa además:
   *   - ordenes: [{tipo:'OIS'|'OIP', idOrden, codigo, clienteNombre,
   *     fechaVencimiento, numTareas}] — muestra la sección "Orden" (tipo +
   *     código) y agrega {tipo, idOrden} a los datos de onSave. Sin `ordenes`
   *     la sección queda oculta (Gestionar OIS/OIP: la orden es la abierta).
   *   - ordenFija: {tipo, idOrden, codigo, clienteNombre} — al editar una
   *     tarea existente, la orden se muestra pero no se puede cambiar.
   *   - tipoDefault / idOrdenDefault: preselección al crear.
   *   - onSave puede devolver una Promise: el popup se queda abierto con
   *     "Guardando…" hasta que resuelva, y sigue abierto si se rechaza (el
   *     llamador muestra el error). Si no devuelve Promise, se cierra de
   *     inmediato, como siempre.
   */
  KGP.tareaModal = (function () {
    var state = { onSave: null, empleados: [], observacionPrevia: '', editando: null, ordenes: null, saving: false };
    var wired = false;

    function $(id) { return document.getElementById(id); }
    function fieldEl(key) { return document.querySelector('#tarea-modal-body .field[data-field="' + key + '"]'); }
    function markInvalid(key) { var f = fieldEl(key); if (f) f.classList.add('invalid'); }
    function clearInvalid() {
      document.querySelectorAll('#tarea-modal-body .field.invalid').forEach(function (f) { f.classList.remove('invalid'); });
    }

    function syncIdEmpleado() {
      $('tm-id-empleado').value = $('tm-responsable').value || '—';
    }

    // ---- Tipo de responsable: interno (PERSONAL_KGP) / tercero (PERSONAL_TERCEROS) ----

    function tipoInterno() { return KGP.ui.tiposResponsable()[0].valor; }
    function tipoDe(e) { return (e && e.tipoResponsable) || tipoInterno(); }

    function tipoActual() {
      var b = document.querySelector('#tm-tipo-responsable .seg-option.is-active');
      return b ? b.getAttribute('data-tipo') : tipoInterno();
    }

    function setTipo(tipo) {
      Array.prototype.forEach.call(document.querySelectorAll('#tm-tipo-responsable .seg-option'), function (b) {
        var on = b.getAttribute('data-tipo') === tipo;
        b.classList.toggle('is-active', on);
        b.setAttribute('aria-checked', on ? 'true' : 'false');
      });
    }

    function tieneOpcion(sel, valor) {
      return Array.prototype.some.call(sel.options, function (o) { return o.value === valor; });
    }

    /** Llena el desplegable de responsable solo con las personas del tipo elegido. */
    function rebuildResponsables(tipo, idSeleccionado) {
      var sel = $('tm-responsable');
      var lista = state.empleados.filter(function (e) { return tipoDe(e) === tipo; });
      var etiqueta = (KGP.ui.tiposResponsable().filter(function (t) { return t.valor === tipo; })[0] || {}).etiqueta || '';
      KGP.ui.rebuildSelect(sel, lista, function (e) { return e.idEmpleado; }, KGP.ui.empleadoLabel,
        lista.length ? '— Selecciona el responsable —' : '— No hay personas registradas: ' + etiqueta + ' —');
      // Si el responsable guardado ya no está en su hoja, se conserva como
      // opción para no perder el dato al editar otra cosa de la tarea.
      var t = state.editando;
      if (t && t.idEmpleado && t.idEmpleado === idSeleccionado && !tieneOpcion(sel, t.idEmpleado)) {
        KGP.ui.addOption(sel, t.idEmpleado, t.responsable || t.idEmpleado);
      }
      sel.value = idSeleccionado && tieneOpcion(sel, idSeleccionado) ? idSeleccionado : '';
      syncIdEmpleado();
    }

    function ordenLabel(o) { return o.codigo + (o.clienteNombre ? ' — ' + o.clienteNombre : ''); }

    function findOrden(tipo, idOrden) {
      return (state.ordenes || []).filter(function (o) { return o.tipo === tipo && o.idOrden === idOrden; })[0] || null;
    }

    function syncOrdenHint() {
      var o = findOrden($('tm-tipo-orden').value, $('tm-orden').value);
      $('tm-orden-hint').textContent = o
        ? ((o.fechaVencimiento ? 'Vence: ' + o.fechaVencimiento + ' · ' : '') + (o.numTareas || 0) + ' tarea' + (o.numTareas === 1 ? '' : 's') + ' registrada' + (o.numTareas === 1 ? '' : 's'))
        : '';
    }

    /** Llena el desplegable de código con las órdenes del tipo elegido. */
    function rebuildOrdenes(idOrdenDefault) {
      var tipo = $('tm-tipo-orden').value;
      var sel = $('tm-orden');
      if (!tipo) {
        sel.innerHTML = '<option value="">— Primero elige OIS u OIP —</option>';
        sel.disabled = true;
        syncOrdenHint();
        return;
      }
      var lista = (state.ordenes || []).filter(function (o) { return o.tipo === tipo; });
      KGP.ui.rebuildSelect(sel, lista, function (o) { return o.idOrden; }, ordenLabel,
        lista.length ? '— Selecciona la ' + tipo + ' —' : '— No hay ' + tipo + ' disponibles —');
      sel.disabled = !lista.length;
      sel.value = (idOrdenDefault && findOrden(tipo, idOrdenDefault)) ? idOrdenDefault : '';
      syncOrdenHint();
    }

    function setupOrdenSection(opts) {
      var section = $('tm-orden-section');
      section.style.display = state.ordenes ? '' : 'none';
      if (!state.ordenes) return;
      var tipoSel = $('tm-tipo-orden');
      var fija = opts.ordenFija || null;
      if (fija) {
        tipoSel.value = fija.tipo;
        KGP.ui.rebuildSelect($('tm-orden'), [fija], function (o) { return o.idOrden; }, ordenLabel, '—');
        $('tm-orden').value = fija.idOrden;
        tipoSel.disabled = true;
        $('tm-orden').disabled = true;
        $('tm-orden-hint').textContent = 'La orden de una tarea ya creada no se puede cambiar.';
      } else {
        tipoSel.disabled = false;
        tipoSel.value = opts.tipoDefault || '';
        rebuildOrdenes(opts.idOrdenDefault);
      }
    }

    function setSaving(saving) {
      state.saving = saving;
      var btn = $('tarea-modal-save');
      btn.disabled = saving;
      btn.textContent = saving ? 'Guardando…' : 'Guardar tarea';
    }

    function open(opts) {
      opts = opts || {};
      var tarea = opts.initial || null;
      state.onSave = opts.onSave;
      state.empleados = opts.empleados || [];
      state.editando = tarea;
      state.ordenes = opts.ordenes || null;
      setSaving(false);
      clearInvalid();
      $('tarea-modal-title').textContent = tarea ? 'Editar tarea' : 'Agregar tarea';
      setupOrdenSection(opts);

      // Tipo de la tarea: el guardado; si la fila no lo tiene (tarea antigua o
      // hoja sin la columna TIPO RESPONSABLE), el de la hoja donde está su ID;
      // al crear, el del responsable por defecto o interno.
      var idInicial = tarea ? tarea.idEmpleado : (opts.idEmpleadoDefault || '');
      var encontrado = state.empleados.filter(function (e) { return e.idEmpleado === idInicial; })[0];
      var tipo = (tarea && tarea.tipoResponsable) || (encontrado ? tipoDe(encontrado) : tipoInterno());
      setTipo(tipo);
      rebuildResponsables(tipo, idInicial);

      document.getElementById('tm-tarea').value = tarea ? tarea.tarea : '';
      document.getElementById('tm-fecha-inicio').value = tarea ? tarea.fechaInicio : (opts.fechaInicioDefault || '');
      document.getElementById('tm-fecha-entrega').value = tarea ? tarea.fechaEntrega : (opts.fechaEntregaDefault || '');
      document.getElementById('tm-obs-nueva').value = '';
      state.observacionPrevia = tarea ? String(tarea.observacion || '') : '';

      var box = document.getElementById('tm-obs-historial');
      var lines = state.observacionPrevia.split('\n').filter(function (l) { return l.trim(); });
      box.hidden = !lines.length;
      box.innerHTML = lines.map(function (l) { return '<div class="obs-item">' + KGP.escapeHtml(l) + '</div>'; }).join('');

      document.getElementById('tarea-modal-overlay').classList.add('open');
      setTimeout(function () { document.getElementById('tm-tarea').focus(); }, 50);
    }

    function close() {
      // Mientras un guardado asíncrono está en curso el popup no se cierra
      // (ni con Cancelar, Escape o clic afuera): si la respuesta llegara con
      // otro popup ya abierto, lo cerraría por error.
      if (state.saving) return;
      var el = document.getElementById('tarea-modal-overlay');
      if (el) el.classList.remove('open');
      state.onSave = null;
      state.editando = null;
      state.ordenes = null;
    }

    function handleSave() {
      if (state.saving) return;
      clearInvalid();
      var texto = document.getElementById('tm-tarea').value.trim();
      var idEmpleado = document.getElementById('tm-responsable').value;
      var inicio = document.getElementById('tm-fecha-inicio').value;
      var entrega = document.getElementById('tm-fecha-entrega').value;
      var ok = true;
      if (state.ordenes) {
        if (!$('tm-tipo-orden').value) { markInvalid('tipoOrden'); ok = false; }
        if (!$('tm-orden').value) { markInvalid('orden'); ok = false; }
      }
      if (!texto) { markInvalid('tarea'); ok = false; }
      if (!idEmpleado) { markInvalid('responsable'); ok = false; }
      if (!inicio) { markInvalid('fechaInicio'); ok = false; }
      document.getElementById('tm-fecha-entrega-err').textContent = 'Elige la fecha de entrega.';
      if (!entrega) {
        markInvalid('fechaEntrega'); ok = false;
      } else if (inicio && entrega < inicio) {
        document.getElementById('tm-fecha-entrega-err').textContent = 'La fecha de entrega no puede ser anterior a la de inicio.';
        markInvalid('fechaEntrega'); ok = false;
      }
      if (!ok) { KGP.toast('Revisa los campos marcados en rojo.', 'error'); return; }

      var tipoResp = tipoActual();
      var emp = state.empleados.filter(function (e) { return e.idEmpleado === idEmpleado && tipoDe(e) === tipoResp; })[0];
      var nueva = document.getElementById('tm-obs-nueva').value.trim();
      var previa = state.observacionPrevia.trim();
      var datos = {
        tarea: texto,
        idEmpleado: idEmpleado,
        tipoResponsable: tipoResp,
        responsable: emp ? emp.nombre : ((state.editando && state.editando.responsable) || ''),
        fechaInicio: inicio,
        fechaEntrega: entrega,
        observacion: nueva ? (previa ? previa + '\n' + nueva : nueva) : previa
      };
      if (state.ordenes) {
        datos.tipo = $('tm-tipo-orden').value;
        datos.idOrden = $('tm-orden').value;
      }

      var onSave = state.onSave;
      var result = onSave ? onSave(datos) : null;
      if (!result || typeof result.then !== 'function') {
        close();
        return;
      }
      setSaving(true);
      result.then(function () {
        setSaving(false);
        close();
      }, function () {
        // El llamador ya mostró el error: se deja el popup abierto para corregir/reintentar.
        setSaving(false);
      });
    }

    function wireGlobalEvents() {
      if (wired) return;
      wired = true;
      document.getElementById('tarea-modal-close').addEventListener('click', close);
      document.getElementById('tarea-modal-cancel').addEventListener('click', close);
      document.getElementById('tarea-modal-save').addEventListener('click', handleSave);
      document.getElementById('tm-responsable').addEventListener('change', syncIdEmpleado);
      // Opciones Interno / Tercero desde la config; cambiar de tipo vacía el responsable.
      var seg = document.getElementById('tm-tipo-responsable');
      seg.innerHTML = KGP.ui.tiposResponsable().map(function (t) {
        return '<button type="button" class="seg-option" role="radio" aria-checked="false" data-tipo="' + KGP.escapeHtml(t.valor) + '">' + KGP.escapeHtml(t.etiqueta) + '</button>';
      }).join('');
      seg.addEventListener('click', function (e) {
        var b = e.target.closest('.seg-option');
        if (!b || b.classList.contains('is-active')) return;
        setTipo(b.getAttribute('data-tipo'));
        rebuildResponsables(b.getAttribute('data-tipo'), '');
      });
      document.getElementById('tm-tipo-orden').addEventListener('change', function () { rebuildOrdenes(''); });
      document.getElementById('tm-orden').addEventListener('change', syncOrdenHint);
      document.getElementById('tarea-modal-overlay').addEventListener('click', function (e) {
        if (e.target.id === 'tarea-modal-overlay') close();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && document.getElementById('tarea-modal-overlay').classList.contains('open')) close();
      });
    }

    return { open: open, close: close, wireGlobalEvents: wireGlobalEvents };
  }());

  // ---------------- Historial de cambios de tareas ----------------

  /**
   * Popup de solo lectura con quién cambió qué y cuándo (hoja
   * HISTORIAL_TAREAS, 42_HistorialTareas.js). HTML: #ht-modal-overlay en
   * Index.html. Siempre pide el dato fresco (api_getHistorialTareas), nunca
   * usa KGP.localCache.
   *
   *   KGP.historialTareas.open({tipo: 'OIS'|'OIP', idTarea, titulo, subtitulo})
   *     -> historial de UNA tarea.
   *   KGP.historialTareas.open({tipo, idOrden, titulo, subtitulo})
   *     -> todas las tareas de la orden, también las eliminadas (cada entrada
   *        dice a qué tarea corresponde).
   *
   * Los cambios hechos en "Gestionar OIS/OIP" se registran al "Guardar
   * cambios", no antes.
   */
  KGP.historialTareas = (function () {
    var ACCIONES = {
      CREADA: { label: 'Creada', cls: 'ht-accion-creada' },
      EDITADA: { label: 'Editada', cls: 'ht-accion-editada' },
      FINALIZADA: { label: 'Finalizada', cls: 'ht-accion-finalizada' },
      REABIERTA: { label: 'Reabierta', cls: 'ht-accion-reabierta' },
      ELIMINADA: { label: 'Eliminada', cls: 'ht-accion-eliminada' }
    };
    var token = 0;
    var wired = false;

    function $(id) { return document.getElementById(id); }
    function h(s) { return KGP.escapeHtml(s); }

    /** 'yyyy-MM-dd HH:mm' -> '19 de octubre de 2026, 15:42'. */
    function fechaLarga(s) {
      var m = /^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}:\d{2}))?/.exec(String(s || ''));
      if (!m) return String(s || '');
      return Number(m[3]) + ' de ' + KGP.ui.mesNombre(Number(m[2])).toLowerCase() + ' de ' + m[1] + (m[4] ? ', ' + m[4] : '');
    }

    function entradaHtml(e, porOrden) {
      var a = ACCIONES[e.accion] || { label: e.accion || 'Cambio', cls: 'ht-accion-editada' };
      var correo = e.correo && e.correo !== e.usuario ? ' <span class="ht-correo">(' + h(e.correo) + ')</span>' : '';
      return '<li class="ht-item">' +
        '<div class="ht-item-head"><span class="ht-accion ' + a.cls + '">' + h(a.label) + '</span>' +
          '<span class="ht-fecha">' + h(fechaLarga(e.fecha)) + '</span></div>' +
        '<div class="ht-quien">Por <strong>' + h(e.usuario || 'Usuario no identificado') + '</strong>' + correo + '</div>' +
        (porOrden && e.tarea ? '<div class="ht-tarea">' + h(e.tarea) + '</div>' : '') +
        (e.detalle ? '<div class="ht-detalle">' + h(e.detalle) + '</div>' : '') +
        '</li>';
    }

    function render(data, porOrden) {
      var entradas = data.entradas || [];
      var html = '';
      if (data.aviso) html += '<div class="ht-aviso">' + h(data.aviso) + '</div>';
      if (!entradas.length) {
        html += data.aviso ? '' : '<div class="empty-state">Aún no hay cambios registrados para ' + (porOrden ? 'las tareas de esta orden' : 'esta tarea') +
          '. Los cambios hechos antes de activar el historial no aparecen.</div>';
      } else {
        if (data.truncado) html += '<div class="ht-aviso">Se muestran los ' + entradas.length + ' cambios más recientes de ' + data.total + '.</div>';
        html += '<ol class="ht-list">' + entradas.map(function (e) { return entradaHtml(e, porOrden); }).join('') + '</ol>';
      }
      $('ht-modal-content').innerHTML = html;
    }

    function open(opts) {
      opts = opts || {};
      var my = ++token;
      var porOrden = !opts.idTarea;
      $('ht-modal-title').textContent = opts.titulo || 'Historial de cambios';
      $('ht-modal-subtitle').textContent = opts.subtitulo || '';
      $('ht-modal-subtitle').hidden = !opts.subtitulo;
      $('ht-modal-content').innerHTML = '<div class="ht-loading"><span class="spinner dark"></span><span>Cargando historial…</span></div>';
      $('ht-modal-overlay').classList.add('open');
      KGP.apiCall('api_getHistorialTareas', [{ tipo: opts.tipo, idOrden: opts.idOrden || '', idTarea: opts.idTarea || '' }]).then(function (data) {
        if (my === token) render(data || {}, porOrden);
      }).catch(function (err) {
        if (my !== token) return;
        $('ht-modal-content').innerHTML = '<div class="empty-state">No se pudo cargar el historial: ' + h(KGP.friendlyError(err)) + '</div>';
      });
      setTimeout(function () { $('ht-modal-ok').focus(); }, 50);
    }

    function close() {
      token++; // una respuesta que llegue después ya no pinta nada
      $('ht-modal-overlay').classList.remove('open');
    }

    function wireGlobalEvents() {
      if (wired) return;
      wired = true;
      $('ht-modal-close').addEventListener('click', close);
      $('ht-modal-ok').addEventListener('click', close);
      $('ht-modal-overlay').addEventListener('click', function (e) {
        if (e.target.id === 'ht-modal-overlay') close();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && $('ht-modal-overlay').classList.contains('open')) close();
      });
    }

    return { open: open, close: close, wireGlobalEvents: wireGlobalEvents };
  }());

  // ---------------- Selector de copias (CC) de los correos ----------------

  /**
   * Popup que se abre ANTES de cualquier acción que envíe un correo
   * (cotización creada/aprobada/rechazada, tarea nueva, OIS finalizada) para
   * elegir quién más lo recibe en copia: personas de la BD (internos +
   * terceros con correo, de KGP.catalog) y correos escritos a mano que no
   * están en la BD. El HTML (#cc-modal-overlay) vive en Index.html.
   *
   *   KGP.mailCc.pedir({titulo, descripcion, para, confirmar, obligatorio})
   *     -> Promise<string[] | null>   (null = el usuario canceló: no hagas la acción)
   *
   * obligatorio: sin Cancelar/✕/Esc (la acción ya ocurrió y el correo debe
   * salir de todos modos; el usuario solo decide las copias).
   * El servidor vuelve a depurar la lista (mail_normalizarCc_), esto es UX.
   * Las copias van ADEMÁS del destinatario de siempre.
   */
  KGP.mailCc = (function () {
    var state = { resolve: null, personas: [], marcados: {}, extras: [], obligatorio: false, previoFoco: null };
    var EMAIL_RE = /^[^\s@,;<>]+@[^\s@,;<>]+\.[^\s@,;<>]+$/;

    function $(id) { return document.getElementById(id); }
    function esc(s) { return KGP.escapeHtml(s); }
    function norm(s) { return String(s || '').toLowerCase(); }
    function maxCc() { return KGP.cfg('MAX_CC', 20); }

    /** Personas con correo (internos + terceros), sin repetir correos, por nombre. */
    function personasDe(cat) {
      var vistos = {};
      return KGP.ui.responsables(cat).filter(function (e) {
        var c = String(e.correo || '').trim();
        if (!EMAIL_RE.test(c) || vistos[norm(c)]) return false;
        vistos[norm(c)] = true;
        return true;
      }).map(function (e) {
        var tercero = e.tipoResponsable === KGP.ui.tiposResponsable()[1].valor;
        return { correo: String(e.correo).trim(), nombre: e.nombre || e.correo, cargo: e.cargo || '', tercero: tercero };
      }).sort(function (a, b) { return a.nombre.localeCompare(b.nombre); });
    }

    function total() {
      return Object.keys(state.marcados).filter(function (k) { return state.marcados[k]; }).length + state.extras.length;
    }

    function renderCount() {
      $('cc-count').textContent = total() ? (total() + ' en copia (máx. ' + maxCc() + ')') : 'Sin copias: solo le llegará al destinatario de siempre.';
    }

    function renderLista() {
      var q = norm($('cc-search').value).trim();
      var lista = $('cc-list');
      var visibles = state.personas.filter(function (p) {
        return !q || norm(p.nombre + ' ' + p.correo + ' ' + p.cargo).indexOf(q) !== -1;
      });
      if (!visibles.length) {
        lista.innerHTML = '<div class="cc-empty">' + (state.personas.length ? 'Nadie coincide con la búsqueda.' : 'No hay personas con correo registrado. Escribe los correos abajo.') + '</div>';
        return;
      }
      lista.innerHTML = visibles.map(function (p) {
        var k = norm(p.correo);
        return '<label class="cc-person"><input type="checkbox" data-correo="' + esc(p.correo) + '"' + (state.marcados[k] ? ' checked' : '') + '>' +
          '<span class="cc-person-main"><span class="cc-person-name">' + esc(p.nombre) + (p.tercero ? ' <span class="cc-tag">Tercero</span>' : '') + '</span>' +
          '<span class="cc-person-mail">' + esc(p.correo) + (p.cargo ? ' · ' + esc(p.cargo) : '') + '</span></span></label>';
      }).join('');
    }

    function renderExtras() {
      $('cc-extra-chips').innerHTML = state.extras.map(function (c, i) {
        return '<button type="button" class="chip" data-i="' + i + '" title="Quitar ' + esc(c) + '">' + esc(c) + ' <span class="chip-x">✕</span></button>';
      }).join('');
    }

    function setError(msg) {
      var el = $('cc-extra-err');
      el.textContent = msg || '';
      el.style.display = msg ? 'block' : 'none';
    }

    /** Agrega los correos escritos (separados por coma, ; o espacios). true si no hubo error. */
    function agregarEscritos() {
      var input = $('cc-extra-input');
      var partes = input.value.split(/[,;\s]+/).map(function (s) { return s.trim(); }).filter(Boolean);
      if (!partes.length) { setError(''); return true; }
      var malos = partes.filter(function (c) { return !EMAIL_RE.test(c) || c.length > 254; });
      if (malos.length) { setError('Correo no válido: ' + malos.join(', ')); return false; }
      var conocidos = {};
      state.personas.forEach(function (p) { conocidos[norm(p.correo)] = true; });
      for (var i = 0; i < partes.length; i++) {
        var k = norm(partes[i]);
        var yaEsta = state.marcados[k] || state.extras.some(function (e) { return norm(e) === k; });
        if (yaEsta) continue;
        if (total() >= maxCc()) { setError('Máximo ' + maxCc() + ' personas en copia.'); renderCount(); renderExtras(); renderLista(); return false; }
        if (conocidos[k]) state.marcados[k] = true; // ya está en la BD: solo se marca su casilla
        else state.extras.push(partes[i]);
      }
      input.value = '';
      setError('');
      renderLista(); renderExtras(); renderCount();
      return true;
    }

    function cerrar(resultado) {
      $('cc-modal-overlay').classList.remove('open');
      var resolve = state.resolve;
      state.resolve = null;
      if (state.previoFoco && state.previoFoco.focus) { try { state.previoFoco.focus(); } catch (e) { /* el elemento ya no está */ } }
      if (resolve) resolve(resultado);
    }

    function confirmar() {
      if (!agregarEscritos()) return; // no perder lo que escribió: si es inválido, se queda abierto
      var correos = state.personas.filter(function (p) { return state.marcados[norm(p.correo)]; })
        .map(function (p) { return p.correo; }).concat(state.extras);
      cerrar(correos);
    }

    function cancelar() {
      if (state.obligatorio) return;
      cerrar(null);
    }

    function pedir(opts) {
      opts = opts || {};
      if (state.resolve) cerrar(null); // un solo selector a la vez
      state.marcados = {};
      state.extras = [];
      state.obligatorio = !!opts.obligatorio;
      state.previoFoco = document.activeElement;
      var cat = KGP.catalog.current();
      state.personas = cat ? personasDe(cat) : [];

      $('cc-modal-title').textContent = opts.titulo || 'Enviar copia del correo';
      $('cc-modal-desc').textContent = opts.descripcion || '';
      $('cc-modal-para').textContent = opts.para ? ('Para: ' + opts.para) : '';
      $('cc-modal-para').style.display = opts.para ? 'block' : 'none';
      $('cc-ok').textContent = opts.confirmar || 'Continuar';
      // style.display (no [hidden]): .modal-close y .btn fijan display y le ganan al atributo.
      $('cc-cancel').style.display = state.obligatorio ? 'none' : '';
      $('cc-modal-close').style.display = state.obligatorio ? 'none' : '';
      $('cc-search').value = '';
      $('cc-extra-input').value = '';
      setError('');
      renderLista(); renderExtras(); renderCount();
      $('cc-modal-overlay').classList.add('open');
      setTimeout(function () { $('cc-search').focus(); }, 0);

      // Si el catálogo aún no llegó (o falló antes), se pide en segundo plano y se repinta la lista.
      if (!cat) {
        KGP.catalog.load().then(function (c) {
          if (!state.resolve) return;
          state.personas = personasDe(c);
          renderLista();
        }).catch(function () { /* queda solo la entrada manual */ });
      }
      return new Promise(function (resolve) { state.resolve = resolve; });
    }

    /**
     * Aviso a contabilidad de que una OIS quedó Finalizada: el servidor ya la
     * dejó Finalizada; aquí solo se eligen las copias y se envía el correo.
     * Nunca rechaza: un fallo se avisa con un toast.
     */
    function avisarOisFinalizada(idOis, codigo) {
      return pedir({
        titulo: 'OIS ' + codigo + ' finalizada',
        descripcion: 'La OIS terminó. Se le avisará a contabilidad que ya está lista para facturar. Si quieres, elige quién más recibe copia de ese correo.',
        para: KGP.cfgTexto('OIS_FINALIZADA_EMAIL', 'contabilidad'),
        confirmar: 'Enviar aviso',
        obligatorio: true
      }).then(function (cc) {
        return KGP.apiCall('api_avisarOisFinalizada', [idOis, cc || []]);
      }).then(function (r) {
        if (r && r.enviado) KGP.toast('Se avisó a contabilidad: la OIS ' + codigo + ' está lista para facturar.', 'success', 6000);
        else if (r && r.motivo) KGP.toast(r.motivo, 'warning', 7000);
      }).catch(function (err) {
        KGP.toast('No se pudo avisar a contabilidad: ' + KGP.friendlyError(err), 'error', 8000);
      });
    }

    function wireGlobalEvents() {
      $('cc-ok').addEventListener('click', confirmar);
      $('cc-cancel').addEventListener('click', cancelar);
      $('cc-modal-close').addEventListener('click', cancelar);
      $('cc-search').addEventListener('input', renderLista);
      $('cc-extra-add').addEventListener('click', agregarEscritos);
      $('cc-extra-input').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); agregarEscritos(); }
      });
      $('cc-list').addEventListener('change', function (e) {
        var cb = e.target.closest('input[type="checkbox"]');
        if (!cb) return;
        var k = norm(cb.getAttribute('data-correo'));
        if (cb.checked && total() >= maxCc()) {
          cb.checked = false;
          setError('Máximo ' + maxCc() + ' personas en copia.');
          return;
        }
        state.marcados[k] = cb.checked;
        setError('');
        renderCount();
      });
      $('cc-extra-chips').addEventListener('click', function (e) {
        var chip = e.target.closest('.chip');
        if (!chip) return;
        state.extras.splice(Number(chip.getAttribute('data-i')), 1);
        setError('');
        renderExtras(); renderCount();
      });
      $('cc-modal-overlay').addEventListener('click', function (e) {
        if (e.target.id === 'cc-modal-overlay') cancelar();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && $('cc-modal-overlay').classList.contains('open')) cancelar();
      });
    }

    return { pedir: pedir, avisarOisFinalizada: avisarOisFinalizada, wireGlobalEvents: wireGlobalEvents };
  }());

  // ---------------- Menú lateral móvil (hamburguesa) ----------------

  function setSidebarOpen(open) {
    var sidebar = document.getElementById('sidebar');
    var overlay = document.getElementById('sidebar-overlay');
    var btn = document.getElementById('hamburger-btn');
    if (sidebar) sidebar.classList.toggle('open', open);
    if (overlay) overlay.classList.toggle('open', open);
    if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  function wireMobileMenu() {
    var btn = document.getElementById('hamburger-btn');
    var overlay = document.getElementById('sidebar-overlay');
    if (btn) btn.addEventListener('click', function () {
      var sidebar = document.getElementById('sidebar');
      setSidebarOpen(!sidebar.classList.contains('open'));
    });
    if (overlay) overlay.addEventListener('click', function () { setSidebarOpen(false); });
  }

  // ---------------- Límites de la config en el HTML ----------------

  /**
   * Los View*.html se incluyen sin plantilla (no pueden leer la config), así
   * que los topes que muestran salen de aquí:
   *   - data-cfg-max="CLAVE": el atributo max del input = KGP.cfg(CLAVE).
   *   - data-cfg-plantilla="... {CLAVE} ...": el texto del elemento con cada
   *     {CLAVE} reemplazada por su valor (p. ej. el mensaje de error del plazo).
   * Si la clave no llegó, se deja lo que ya trae el HTML.
   */
  function aplicarConfigAlHtml() {
    document.querySelectorAll('[data-cfg-max]').forEach(function (el) {
      var v = KGP.cfg(el.getAttribute('data-cfg-max'), null);
      if (v != null) el.setAttribute('max', String(v));
    });
    document.querySelectorAll('[data-cfg-plantilla]').forEach(function (el) {
      var completo = true;
      var texto = el.getAttribute('data-cfg-plantilla').replace(/\{(\w+)\}/g, function (m, clave) {
        var v = KGP.cfgTexto(clave, null);
        if (v == null) completo = false;
        return v == null ? m : v;
      });
      if (completo) el.textContent = texto;
    });
  }

  // ---------------- Init ----------------

  KGP.init = function () {
    KGP.setConn('connecting');
    aplicarConfigAlHtml();

    document.querySelectorAll('.nav-item[data-nav]').forEach(function (el) {
      el.addEventListener('click', function () {
        KGP.nav(el.getAttribute('data-nav'));
        setSidebarOpen(false);
      });
    });

    wireMobileMenu();
    KGP.entityModal.wireGlobalEvents();
    KGP.servicioModal.wireGlobalEvents();
    KGP.tareaModal.wireGlobalEvents();
    KGP.historialTareas.wireGlobalEvents();
    KGP.mailCc.wireGlobalEvents();

    var initial = window.KGP_INITIAL_VIEW === 'dashboard' ? 'dashboard' : 'cotizacion';
    KGP.nav(initial);

    // Salvavidas: si algo impide que la vista inicial llame a KGP.hideLoader()
    // (error no controlado, etc.), no dejar al usuario mirando el loader para
    // siempre.
    setTimeout(KGP.hideLoader, 20000);
  };

}(window.KGP));
</script>
